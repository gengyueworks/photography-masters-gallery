;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Sarah Moon</h2><div class="sub">1941– · 法国</div><p>Sarah Moon 是摄影界最梦幻的名字。她 1941 年出生于英国，1960 年代在巴黎成为模特，1968 年拿起了相机。她的照片像月光下的回忆——模糊、朦胧、带着旧照片的颗粒。</p>
<p>她的时尚照片不用清晰对焦——模特在虚焦里像幽灵一样漂浮；她的芭蕾系列拍舞者在慢速快门里变成光的轨迹。她为 Cacharel、Chanel 拍过广告，也为日本三宅一生拍过 20 年大片。</p>
<p>她说：'我不拍衣服——我拍记忆。时尚会消失，但记忆会留下。'她 1995 年获得法国国家摄影大奖，是当代最有文学感的时尚摄影师。</p></div><script>var images=["0142ac5d3b0b8f2111ba277bfdd307b3.jpg", "01803fb8d844e2b0cc29579dab7018b4.jpg", "01cdcfd86f37a79a9e87ee00de4b4f35.jpg", "0360e8ea34d2d24bc96a69fa944b582f.jpg", "03e6a1a662233b773b52f17777a5c505.jpg", "04920daffdd2dcc008722b9a83ea0703.jpg", "05664d76c0c0c15009e503479d894b1f.jpg", "056bd04278f07e45ade303771f76937f.jpg", "05f80ebd9a86d023df8b124616f46c93.jpg", "066993a4abf6029338b745962dbbc512.jpg", "07ee73674f5c34fdc6491c9f755912dc.jpg", "0860b5ca22025e430bed28bd350a1d07.jpg", "08cc431c61572c10dd056ec44758f88e.png", "0a96efe0a26327b038b6e9b45c14f9a4.jpg", "0c28f1d0d8c66e28e51d011ce6d035fb.jpg", "0db2830dc9fe33a681a66c2f6b038fce.jpg", "0f54dab7ef9a57d9156fc3706d5b4fec.jpg", "0f812a528cc5b2302c770a07d9430aab.webp", "105db91f247a7dd2cd3003fb8559737f.jpg", "10823f37ff8c512d0c8e933eab641641.jpg", "11367c190390e311d7161eb6c8229bc2.jpg", "13a7a4980d11824dd8d7cc7fa48fc3b4.jpg", "14019c70b03c302df3dff8841657d65a.jpg", "141851c554b9dc6ce5fece33e668b064.jpg", "14cae8decae50e479a753a73d932c655.jpg", "1554b88e32071d9b48c6bb20bf288fa9.jpg", "1667e2d1e0a8efca868149b7a02c51c6.jpg", "16ca7b9fa9910c17f890a383bfc422cc.jpg", "17393914b2eca6cab56cefeb02eb39b4.jpg", "179a50b28c678621d4a62c633b2bc16e.jpg", "17d49ce4805f64069a1467e309143a0d.jpg", "1836b800a90fe5b795cdc13beaed18a3.jpg", "1932594c69a8c5d6beee292b899c8a95.jpg", "1be5700179e64f2c05a8cdf534799b4a.jpg", "1c02947282e3f51d066f8b834e96ebb4.jpg", "1ccf3453cbc600b5114f3c22690eeb8e.jpg", "1f2c7c37d2eb6aff3c61102f7bdfa355.jpg", "1f6d80c5535108723313371bc1a8ec5a.jpg", "1fa18befe8ac85e55111e8637cca477f.png", "1fe4b3170cd637f6ed9b94db729938d9.jpg", "20508c1c4d5d92d6efcc318d39ca061d.jpg", "208671cf555d02a7a10aaf7f130ae4cf.jpg", "230284d3b54f797d5bd558899a59b25c.jpg", "2426ac50fcd416b257a677358cb84761.webp", "24fcd0dbcacf887d59f2bed06eda777e.jpg", "25bc021c6cb042d11ffc9398af05621e.png", "25ddf46772dbf92d3c44592d7176305e.jpg", "266b7c344c068524f0bc
