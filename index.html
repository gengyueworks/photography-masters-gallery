"}];
let currentCategory = 'all';
let currentSearch = '';
let currentView = 'list';

function getFilteredData() {
  return MASTERS_DATA.filter(m => {
    const matchCat = currentCategory === 'all' || m.category === currentCategory;
    const q = currentSearch.toLowerCase().trim();
    const matchSearch = !q || 
      m.name_zh.toLowerCase().includes(q) || 
      m.name_en.toLowerCase().includes(q) || 
      m.equipment.toLowerCase().includes(q) ||
      m.masterpieces.toLowerCase().includes(q) ||
      m.style_desc.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function render() {
  const listEl = document.getElementById('listContainer');
  const cardEl = document.getElementById('cardContainer');
  listEl.innerHTML = '';
  cardEl.innerHTML = '';
  
  const data = getFilteredData();
  
  if (data.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; padding:60px 0; color:var(--text-muted);">未找到匹配的摄影大师</div>';
    return;
  }
  
  data.forEach((m, idx) => {
    const numStr = String(idx + 1).padStart(2, '0');
    
    // 1. List Item
    const item = document.createElement('a');
    item.className = 'master-list-item';
    item.href = m.gallery_url;
    item.innerHTML = `
      <div class="item-num">
        <span>#${numStr}</span>
        <span class="item-country">${m.country}</span>
      </div>
      <div class="item-names">
        <div class="item-name-zh">${m.name_zh}</div>
        <div class="item-name-en">${m.name_en} · ${m.years}</div>
      </div>
      <div class="item-details">
        <div class="item-equip">📷 ${m.equipment}</div>
        <div class="item-desc">${m.style_desc}</div>
      </div>
      <div class="item-count-badge">
        <strong>${m.high_res_count} P</strong>
        <span>高清收录</span>
      </div>
      <div class="item-action-btn">
        浏览作品 ➔
      </div>
    `;
    listEl.appendChild(item);
    
    // 2. Card Item
    const card = document.createElement('a');
    card.className = 'master-card';
    card.href = m.gallery_url;
    card.innerHTML = `
      <div class="card-cover-wrap">
        <img class="card-cover-img" src="${m.cover_image}" alt="${m.name_zh}" loading="lazy">
      </div>
      <div class="card-content">
        <div class="card-header">
          <div class="card-title-zh">${m.name_zh}</div>
          <div class="card-title-en">${m.name_en} · ${m.years}</div>
          <span class="card-meta-tag">${m.category_label}</span>
        </div>
        <div class="card-quote">${m.quote}</div>
        <div class="card-footer">
          <span style="color:var(--text-gold); font-weight:700;">${m.high_res_count} 幅高清原作</span>
          <span style="color:var(--text-primary); font-weight:600;">进入画廊 ➔</span>
        </div>
      </div>
    `;
    cardEl.appendChild(card);
  });
}

function handleSearch() {
  currentSearch = document.getElementById('searchInput').value;
  render();
}

function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(cat));
  });
  render();
}

function setViewMode(mode) {
  currentView = mode;
  document.getElementById('btnListView').classList.toggle('active', mode === 'list');
  document.getElementById('btnCardView').classList.toggle('active', mode === 'card');
  const listEl = document.getElementById('listContainer');
  const cardEl = document.getElementById('cardContainer');
  if (mode === 'list') {
    listEl.classList.remove('hidden');
    cardEl.classList.remove('active');
  } else {
    listEl.classList.add('hidden');
    cardEl.classList.add('active');
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'paper';
  const next = cur === 'dark' ? 'paper' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('masters_hub_theme', next);
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('masters_hub_theme') || 'paper';
  document.documentElement.setAttribute('data-theme', saved);
  render();
});
</script>
