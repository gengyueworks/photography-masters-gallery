const grid = document.getElementById('grid');
photographers.forEach(p => {
  if (p.count === 0) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = `<p>${p.name} · 待收录</p>`;
    grid.appendChild(div);
    return;
  }
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `photographers/${p.slug}/${p.href}`;
  a.innerHTML = `<img src="photographers/${p.slug}/${p.image}" alt="${p.name}"><div class="overlay"><div class="name">${p.name}</div><div class="count">${p.count} ${p.label}</div></div>`;
  grid.appendChild(a);
});
