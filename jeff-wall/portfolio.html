看起来像街头抓拍。</p>
<p>他花了 9 个月搭景、选演员、排练，才拍出一张《忽然一阵风》——一张模仿葛饰北斋版画、但发生在现代温哥华街头的照片。他的《模仿者》拍了一个白人模仿亚洲人走路的瞬间——种族议题用最日常的场景讲。</p>
<p>他的作品通常用灯箱展示——就像广告牌一样发光。他证明了一件事：摄影也可以像绘画一样被"创作"——而不只是"抓取"。</p></div><script>var images=["0094c5d5940c3dbade9ed586cf44834f.jpg", "00e9f39d9c2d50da2a0c2151f00b08d8.jpg", "012dc90295c32a5cbec97b8c1de88b13.jpg", "0302fd6d69a5544a705c3b978b1a1c6f.jpg", "045ff78f5f37ed5f0ea1cb7dc0cfe980.jpg", "05d3dd0dc99d0f8f5b8399c0506ed08e.jpg", "080582183bb58df78029ec208a523a6b.jpg", "0bd0392b6f84898d017679c4f8265765.jpg", "0c54b4ff011fb182ae689ae8b5d8bceb.jpg", "0cfacd418dfa9817acb62e0f5bee2655.jpg", "0d4b0ae98ffb20ed8fca3dec9c920e21.jpg", "0f03601ec89dd8df50ae1be078328108.jpg", "12756279824e593c304d4c6874aad2b5.jpg", "12bdc0f8d50268509465c4ec55d783d1.jpg", "153513f7210b001baef89375913bc61e.jpg", "168bc0ccc21df3e5a6ec96dcacd3b2d8.jpg", "172d7eeed0302f60f33a31981229b791.jpg", "1778a61092d0c7260658462f254db276.jpg", "18c08492cfa4b457f50d1437dff76fc2.jpg", "1a421fa56d48692fb423cc40aa7e3c82.jpg", "1c19359547d7bbc240cdb9fc86417650.jpg", "1df3bd217386efd3686a4017cc816568.jpg", "1e5e3d386343758727de86058b03033e.jpg", "1e610dd24643b12072ee75b14be82bb8.jpg", "1f9fbe5c2589d2ee0f73031992bc481b.jpg", "1fc7bab577debd6f4dcc08b22775c43c.jpg", "21342736f8b393eb3737dc8fafb6050b.jpg", "22304368ece8c87a8abdb4a970eaf725.jpg", "22d29d164cb7bb380b724d40a6e7004d.jpg", "23519d8f0fba47219e97d32746b42c40.png", "244a60d9f4cb3e64cdcdb73eac98e2f4.jpg", "2685fce53c6dfb97a1e5aef5725858e9.jpg", "29e34f1baa091a99975d7308cc005254.jpg", "2a40d00be847ae25450fa4bac7e95c25.jpg", "2a62539694469c36dbcb2cb2733ff41a.jpg", "2a6a890ef2ed796d215a6d0ee9e9062f.jpg", "2de8e5d437d1d796125f3e8c1e18072f.jpg", "2e5ec2b4eb87edd68258cd46f5d6deed.jpg", "2f406dff2f6b2efddf4782820f9d2873.jpg", "2f7f3e8f0f3cc43859d8047262f1ec23.jpg", "2fc4acf062236a9d24e6a72c9fc4f2e4.jpg", "30b9700cff27082be8de666bd41e13cc.jpg", "31704da941edeaea1848361c6916f8f9.jpg", "31d424be9aaad50e51e3c6d9c0f16ffe.jpg", "33959240c2f6d78bbecacd54f2ac3c79.jpg", "352fd0da7012ed94703904f1d438745a.jpg", "3631c4479514e155fe3560104ef29576.jpg", "364e215dddbdab2d8bc736379c6df
