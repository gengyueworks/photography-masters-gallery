生活了 30 多年，专门拍北美的野生动物。</p>
<p>他的代表作《Catch of the Day》——一只棕熊从瀑布边跳起，恰好咬住了一条跃出水面的鲑鱼——这是全世界最著名的野生动物照片之一。他的镜头下还有灰狼、白头鹰、北美野牛、落基山脉的麋鹿。他的摄影是"不打扰"的——用长焦拍摄，从不干扰动物的生活。</p>
<p>他说：'我在黄石等了 20 年，就为等一张照片。耐心比技术重要——动物才是导演，我只是剧务。'</p></div><script>var images=["03134548aadb224913ae46ebf842991b.jpg", "06ec229092ec5ae70523c97abf3be9e8.jpg", "0d5188049504b1b78da49900f2f79f49.jpg", "0ff7508e58f0e9dac4a4230284570f20.jpg", "14e0f545ea05886f417815c68b5fcff8.jpg", "152ed91050c632be2434e33652c70174.jpg", "2205067e51051ca61ffe69ce100803b1.jpg", "271d4b1b8fb4d1a02d51f9951397b3b4.jpg", "2f085d68f59c89f75e0bc814191683b8.jpg", "2fcdb222337121f26cfc8b3e02172768.jpg", "30310dc726290380890a6267e0522db1.jpg", "306449aa18f1209370e8753c85ba0461.jpg", "34a06e56a073032de633aec0d59bc0e7.jpg", "3a78cb6434d2f055b6f4d323fecd32c9.jpg", "3bfabab318d9feb2dd8928a29746ab9e.jpg", "45524a9b617fa85b92652ab78e21dd8b.png", "504422a45a75d7d29a53286490f89ae5.jpg", "5a47ca82d374f697835b00c19668982c.jpg", "637554a75660ab782b0d9e0017adba67.jpg", "6479db1029cdbe6285c4a22f93cf1243.jpg", "7045825b8c4bb8aaf534f688edbfad7e.jpg", "759a6175439ce936aab04bf2c3aed211.jpg", "78e997654a8f4dfa3b2a860fc3635fdd.jpg", "808f3d1b30723019bb777af209854d3b.jpg", "887680f13d06097c7bbd1dfdbbd1dfa5.jpg", "95b1e4fd4d1fff15f41089620ac8ee09.jpg", "96b0e5a0f6e10b214c8c9eb615550b87.jpg", "b1039530524f828b23d9ddc4198c37c6.jpg", "b7d62f12df9f706c123b847cc12075e4.jpg", "caf531c138c9b8f1f0be16f221e03848.jpg", "d36f995f3668589430e8c3c6731355e6.jpg", "d51e54eb94727f2d9d670bfa540bdb79.jpg", "d7b8951ce15aeb9d74f15cea760df6b6.jpg", "f3acf0679b3559600f282c2587c8ce48.jpg", "fc3496ef2d0f97d8892f44a197aa7464.png", "ff91439cba1f28b8c690ff32dc997178.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(id
