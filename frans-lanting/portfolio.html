了非洲，从此再没回头。</p>
<p>他的作品集《Life》被称为"摄影界的创世纪"——他用几年时间跑遍全球拍摄生命的诞生：刚孵化的海龟、刚出壳的信天翁、幼象跟着妈妈。他拍的企鹅、雪鸮、大猩猩——每一张都像古典肖像。</p>
