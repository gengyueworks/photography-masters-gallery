有一个方法：极慢的快门。</p>
<p>他的《海景》系列——用 50 分钟曝光拍海与天的交界——拍出了时间本身。世界各地的海景最后都变成了同一道地平线：黑与白、水与气。他的《剧院》系列——把整个电影放完只按一次快门——荧幕变成了一个发光的白色矩形，观众消失，只剩下时间。</p>
<p>他还拍了佛寺的佛像、蜡像馆的蜡人、恐龙的化石骨架。他说：'相机是时间机器——我拍的不是物体，是物体在时间里留下的痕迹。'</p></div><script>var images=["00d151ee37b578098b2619707586b6e2.jpg", "038bc6185f7b0681c08b35516a1bd9c1.jpg", "04bd84d43ea6b30447c7c2e10ca9301a.jpg", "082b70a5b2c30e24ef6cd556360205e0.webp", "086b5bc66e14d0c8b841488ed3db6c8d.jpg", "0b04fc435cde3bb81d8e31bb9d70d51a.jpg", "0cef650ad04c0f1dcbc7f9a45d4b65af.jpg", "0df87359e4874657b2458297fbd7d24d.jpg", "0f1023865e9cd43f34aa718095bac187.png", "1098764eb796a2568a673021546d7ba9.jpg", "10d3ba55d974aeb047f003a7373d1681.jpg", "11af23d7f7b12d98e4aea0b37b7621fc.jpg", "11c643970c65d7acd686effd8c0e1a46.webp", "14aa03a55307a54d1494dfbc01e1365a.jpg", "14ea6e741edb2b5eba9310711523c139.jpg", "157aca48f2e45b867ca24222952cbcc8.jpg", "186ca49ca933283c7d5635750b84fa83.jpg", "186f726c79cebfe6e9d9775ac18eabdf.jpg", "1938e11fee036d88981b0fe8eb5502cb.jpg", "1d3f89332a317cb1631d40b384e0333c.jpg", "1dc688edd578913f08ce905f055e7916.jpg", "1dda8ad498b584aaf8df60f76293a745.jpg", "1f1bfc96554ccfa1de8cfc400125967d.jpg", "1f626a9444f7465ba8546a505109a4e0.jpg", "22473e75e94f81a114beb3864059f38c.jpg", "22b7b455266507007c790a6147ac38e3.jpg", "252fc136ec930eae28279dce4cb38c84.jpg", "2a00c666ecc85c2812642fead983d5f6.jpg", "2a62bb90176c5db7be1c6b795ba1a82e.jpg", "2c0ea2c4b1bca1dd529236145e115bff.jpg", "2e8bdbe0406a1f3e7c89304fcad4f7a1.jpg", "30d1d897e1fe0b1461b867134ac1ae8e.jpg", "3260739d0dd2f7cfb4ad281ceacd610a.jpg", "328a3a12d4fdb91bd2b2d5814ad9c726.webp", "331fd00fc568b2555de80380f17ee63e.jpg", "33600cf4b190d56154b4fe2e59e11c26.jpg", "344e1575696af5fe55c96250a3830ad5.jpg", "366f6a1d3139d9ff1b86c1e66d43b2ad.jpg", "388c7216ff7ddfa52b157ff334f2b3bb.jpg", "397eb61c2ed3d768e6593102f59172c0.jpg", "39dab8b725976cb0c2f2d05d86b15c66.jpg", "3ae2eae575fd25430494fe167551b89e.jpg", "4060ea80562d35cbfbf68aa4aeb96c4a.jpg", "412729bc025585bc662029359a369df5.jpg", "4197588fbd0247e08caf8613bec4b858.jpg", "4637527d7eed4e2ceb4c3ad8a7511b99.jpg", "465f8e8c193e083c45d4ebd3f4cdb949.jpg", "477c571fbde7e77d964325a
