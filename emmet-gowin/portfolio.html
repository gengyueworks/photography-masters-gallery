—但他后来的照片比老师的更私人。</p>
<p>他从 1961 年起拍他的妻子 Edith 和他们的家庭——30 年时间，同一个女人从少女变成祖母。这些照片安静、亲密、像日记——被认为是美国摄影里最长的家庭影像档案之一。</p>
<p>1980 年代他转向航拍——从飞机上俯瞰核试验场、火山灰、被工业污染的河流。他说：'我想从上帝的高度看看我们到底做了什么。'他的家庭与他的风景是同一件事：爱和破坏。</p></div><script>var images=["05c0df8130d232f42dfaa9ba38d5b573.jpg", "073fab83485b7a2e3a7d7c88e0f99643.jpg", "0994464b15f74d12d0a45b51ab0061a3.jpg", "0a15fd5e457b27cc015e55add219d905.jpg", "0a4ad980e307cccd15a21357cb3823e4.jpg", "0c15b1a372d5d3859739d8fd82777cf6.jpg", "0c308a1c28371638d34cd7d4c4decf94.jpg", "0c434f4d3a22c4b6da4d391d14bd744e.jpg", "0fb6614d2705a5e3739aa3fb2e22093b.jpg", "100e998d789c904d2bda2f983bb9b293.jpg", "14bc53ada63bb84f303c84602635d26c.png", "15eaee6aa9d21dcd58d08612ca838dec.jpg", "15f68da98f72a4b056e77e0f6b519a38.jpg", "184020a351820f2da0ecffc726ee271d.jpg", "1967748acfb6f8b5d62c6f09b121f7cb.jpg", "19e2eaef0e9ebd7c7aa65f054088af90.jpg", "1e444aa1be0cb975e3c1e0646555ec14.jpg", "2316e1225fe27f3d97a2b85d0097abda.webp", "23387b32481194ae8ce31aa710f920bd.jpg", "23eed638f40a4e694876746273ed73f3.jpg", "27cbf9bec127b4d1be88525ac5c5b120.jpg", "2b57bdda12db34a933bdf910c37d1bac.jpg", "2d402d9bd4c467f2305887cae4571643.jpg", "2f8aa9baec314d882d248cb868147db8.jpg", "30ecf98d6e57562525e9ffd44b17237e.jpg", "332e87ce571d289ffab934d064409d25.jpg", "33422bdaeeb1caba53ec0e910ce127e5.jpg", "34f24a982ed5e77a8b279dc680865263.jpg", "365dd86e0d0c0db2b91f149169f00933.jpg", "37f5130c6a0dde4f15b8d5aa3c9bc4ac.jpg", "389bd8fee545a8c3ccf8c6b797d3d7db.jpg", "38c3ab9e96cd1feac1599b0f48107a67.jpg", "39b8cbf9afb50a9ddbd7c712f5e1e740.jpg", "3bfa830ecd1458040a629e8c8de7f2e1.jpg", "3cdfae83ed7a98789d6766ff8f3cdca1.jpg", "3d09f7d53b5d1a4c2ac84457f9cd475f.jpg", "3e9f767af9764a96f4a2cb4982e12a41.jpg", "40e15918e92375364f6e33ed957a4a77.jpg", "40e7508b682f24e4991d3aa76c027f12.jpg", "41266aa19a963e55f15751466ff2aa97.jpg", "437becfae4ae5adba3b65c0169229e13.jpg", "44cff22935fea7388b24d214de79fab5.jpg", "45ca8e3d7202cd1cd15324944e60661b.jpg", "4b2906f4b6e3b631064ef39cdd427905.jpg", "4d2d917f7b4e07712221bae3c7eb3125.jpg", "4d92f4fc8e2ab7e66dcf75a85c2b7737.jpg", "4e7e272b9e02937d662b036b70a97837.jpg", "4ee
