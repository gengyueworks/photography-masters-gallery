body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; height: 100vh; width: 100vw; user-select: none; -webkit-user-select: none; cursor: pointer; }

#counter { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); font-size: 14px; color: rgba(255,255,255,0.5); z-index: 10; letter-spacing: 2px; }
#filmstrip { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 4px; padding: 0 16px; overflow-x: auto; z-index: 10; scrollbar-width: none; }

#filmstrip .thumb { height: 56px; min-width: 56px; flex-shrink: 0; border-radius: 2px; overflow: hidden; cursor: pointer; opacity: 0.35; transition: opacity 0.2s, transform 0.2s; border: 2px solid transparent; }

#filmstrip .thumb.active { opacity: 1; border-color: #fff; transform: translateY(-4px); }
#filmstrip .thumb img { width: 100%; height: 100%; object-fit: cover; }
.nav-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: none; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; border-radius: 50%; z-index: 10; transition: background 0.2s; }
.nav-btn:hover { background: rgba(255,255,255,0.15); }
#prev { left: 20px; } #next { right: 20px; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; background: #000; transition: opacity 0.5s; }
#loading.hidden { opacity: 0; pointer-events: none; }
.loader { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#home-btn { position: fixed; top: 20px; left: 20px; z-index: 20; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: background 0.2s; text-decoration: none; display: inline-block; }

var currentIndex = 0;
var preloaded = new Set();
function init() {
  document.getElementById('counter').textContent = '1 / ' + images.length;
  buildFilmstrip();
  showImage(0);
  document.getElementById('loading').classList.add('hidden');
}
function buildFilmstrip() {
  var strip = document.getElementById('filmstrip');
  var maxThumbs = Math.min(images.length, 200);
  var step = images.length > 200 ? Math.ceil(images.length / 200) : 1;
  for (var i = 0; i < images.length; i += step) {
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.innerHTML = '<img src="images/' + images[i] + '" loading="lazy" alt="">';
    thumb.onclick = function(idx) { return function(e) { e.stopPropagation(); showImage(idx); }; }(i);
    strip.appendChild(thumb);
  }
}
function preload(index) {
  if (index < 0 || index >= images.length || preloaded.has(index)) return;
  preloaded.add(index);
  var link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.href = 'images/' + images[index];
  document.head.appendChild(link);
}
function showImage(index) {
  currentIndex = index;
  var display = document.getElementById('display-img');
  display.style.opacity = '0';
  setTimeout(function() {
    display.src = 'images/' + images[index];
    display.onload = function() { display.style.opacity = '1'; };
  }, 100);
  document.getElementById('counter').textContent = (index + 1) + ' / ' + images.length;
  var thumbs = document.querySelectorAll('#filmstrip .thumb');
  var step = images.length > 200 ? Math.ceil(images.length / 200) : 1;
  var thumbIdx = Math.floor(index / step);
  thumbs.forEach(function(t, i) { t.classList.toggle('active', i === thumbIdx); });
  if (thumbs[thumbIdx]) thumbs[thumbIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  preload(index - 1); preload(index + 1); preload(index + 2);
}
function next() { showImage((currentIndex + 1) % images.length); }
function prev() { showImage((currentIndex - 1 + images.length) % images.length); }
document.getElementById('next').addEventListener('click', function(e) { e.stopPropagation(); next(); });
document.getElementById('prev').addEventListener('click', function(e) { e.stopPropagation(); prev(); });
document.getElementById('main-image').addEventListener('click', function(e) {
  var rect = document.getElementById('main-image').getBoundingClientRect();
  if (e.clientX - rect.left < rect.width / 3) prev(); else next();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
var touchStartX = 0;
document.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', function(e) {
  if (Math.abs(touchStartX - e.changedTouches[0].clientX) > 50) { (touchStartX - e.changedTouches[0].clientX > 0) ? next() : prev(); }
});
init();
</script>
