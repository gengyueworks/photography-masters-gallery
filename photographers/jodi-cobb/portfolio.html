国家。</p>
<p>她的代表作《艺伎》——1995 年她获得了史无前例的许可，深入京都的花街拍摄艺伎的真实生活——不是游客看到的表演，而是她们凌晨起床、化妆、学艺、睡觉的日常。这组照片引起了全球轰动。她还拍过中国改革开放初期的第一代富豪、也门的面纱女性、纽约的唐人街。</p>
