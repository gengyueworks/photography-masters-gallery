粉丝——他用视频记录自己如何寻找光线、如何构图、如何在暴风雪里保护相机。</p>
<p>他的照片拍的是冰岛、苏格兰高地、美国犹他州、新西兰——巨大的山体、流动的云、孤独的树。他的风格是"自然不做作"：很少用滤镜，靠真实的光线和时机。他教了全球上百万观众"风景摄影不是拍风景——是拍光线落在风景上的那一瞬间"。</p>
<p>他说：'摄影最大的浪费不是钱——是你站在了错误的地方等光。'</p></div><script>var images=["04ba90c0ce0618d255ddd7817fb8055e.jpg", "0768b20b1aae99d8ca5775504e8c7af0.jpg", "0e6dacc7e4b744d2f95eebe4103e3515.jpg", "19092bd2170ca313b89e168273037087.jpg", "2ebf0fdd75dc7b7c32286a2180e0ebfc.jpg", "3cd022c69b7ebb54bd2e60427cd8baf8.jpg", "42d319043138647d216274dbe8c1be0a.jpg", "4d4c8f0ec9bf5f5cb65efa36cbbbba77.jpg", "4fdf71f1e93eff30fa40e93793d4d182.jpg", "537ab28c019d3820f2635cc79cbe9d40.jpg", "57167d1165aa4628c461ab7f19b0a8e5.jpg", "5fe1c85b65eef38cc04f008605167ca6.jpg", "67335b4ec78abb9db054ef542b0249f0.jpg", "6f51277e6bed2e1fa128e172c80edf73.jpg", "70a507940e879af3e1f4da168e17b5d0.jpg", "8223a964b5d688eb02ca32dffc080a5c.jpg", "8b8fb79fd461ec24f13465110d070773.jpg", "8cf439cbc5646077ba433748d9a6cd85.jpg", "8df52b23d888933ff14a0b1f21569e12.jpg", "90979be74764230181df6ba4d6ab446c.jpg", "933d3458f53b640c3274336691d90e3b.jpg", "9739d02e63bfe44b78afb93434c8e0c0.jpg", "980096a912d5faf19e053344c65fd553.jpg", "9ad2e08a4f750bb959ebb2fd47e8d3aa.jpg", "9d02c8736d8cc52240f302837b73d282.jpg", "a3221b70f8eca4fa81c926c3af4c50ce.jpg", "a632b4b484e5a5d477c06fa4fd29125e.jpg", "a78e30beb7e5aae470acb47d4411143b.jpg", "aa5fb34ddc698ffba5b5c1b2e5869ef8.jpg", "b39ab3ccbad761e31bb2c6955e21921c.jpg", "be2df852a6be9f81604902d4e562d2fb.jpg", "c49d6f6f3c14b674ad618a77a486ddd1.jpg", "cfdae49c447c78e37df78945eb4de8eb.jpg", "d4c84d9a4a91982c39133d2a5ac695c1.jpg", "e8eef5340a9b56fa89a386e54d42ab80.jpg", "f781804c125c7a7211ac7d6d52618f84.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images
