的石头、树根、雪堆、水纹拍成了灵魂的暗喻。</p>
<p>他创立的 Aperture 杂志至今仍是摄影界最重要的理论刊物。他提出的'Sequence'概念——一组照片像一首诗一样排列而非单张观看——影响了后来几代摄影师。</p>
<p>他的照片总有一种宗教般的沉静感。一面被雪覆盖的墙、窗户上结的霜、被阳光照亮的石头——他说：'一张照片应该像一面镜子——不仅仅照出世界的样子，更要照出你内心的样子。'</p></div><script>var images=["08a5def6337ac23078df7ecaf90310d8.jpg", "10ebe2de644c51d3b41d407914f8a9c4.png", "125a15f95fbf6e0d8930122756068e66.jpg", "171af501672c27023dc3fca7516a1737.jpg", "195169a1d66e78f5631040eb38516441.jpg", "1edbe748e8c79ecefaf4d5edfe5b17b4.jpg", "237efa527a20195bb8c28e7db4256d0d.jpg", "24c53c709df279b59c9010680be6ba19.png", "26a330efb40e94bd2efbb8a07e97f38d.jpg", "2854f0e7b04e277b54dafd2329263f34.webp", "2d5e2ddca8abda3cfa5fd541d577fbe1.jpg", "2ff18e24938f4523b970b1e477fd841a.jpg", "3575025609e7bb9f356c2688fdb270f0.jpg", "36442621703516e37eafd6d497f068ff.jpg", "3822bf2e2d6fcf0a1864cc3c1acd71e7.jpg", "3b4f6265e8baab73e9384df4ea70a337.jpg", "3e35697e1970757fb7c211428ae1d59d.jpg", "3e60f9cba514e32bc611cf52f161f3ba.jpg", "42ef35c65a473aee49f392971a9436e5.jpg", "437960c672ad77cd9d575327e59fa499.jpg", "44f1fdb2d2a530913ae096dc9ba6c89a.jpg", "49cc2ee63843eafc9e340a5696e89f94.jpg", "4e33fdd68cd2d8afeb9d94ca4c607f6c.jpg", "501041dd724a22454c8e1416ef3a3e1f.jpg", "509c9e2e20976851e0be51d24cd90c9f.jpg", "51c0eb576c3eef196007d31531b2b37e.jpg", "53a061164fe490c667ac7da164849126.jpg", "53bdbaab723a51039a855b3968dfd5d6.webp", "57a1113871b4ce7cbed3a326eb07100d.jpg", "5d5510faeb33b00ee0b8e66cda4fe0a0.jpg", "62facb82b012a26113ee694089b0b0a2.jpg", "6b8366a47922dffbbbc0b3bcd4375a39.jpg", "6ba64b61099c221f4efc1226d7f8e730.webp", "6c93c1689f29a0b69ba3203964423c50.png", "6e6b8d4b86cc9532082f72d8b9819806.jpg", "75996dd5230e96453b78bac121a00f03.webp", "7952c49f7afe8296a9ec9695d10dc754.jpg", "7ae446e29824c81731b3152977a6c2f2.jpg", "90debdcb9319ca550bce2fb02462d83f.jpg", "9105e19c8b6469549a06feefdefcc2ba.jpg", "911509a8d58abee681ab4762038d61b2.webp", "9778c4a42e1456d9ddbafe22e0374896.jpg", "993f4c526e2a10226931528ee4ae4831.jpg", "9c2a1d41c3e00ee570e8e62442006d23.jpg", "9da8e0f4bf0e41910fdf1bd9e6249e7b.jpg", "a00027fdeae4b7b4836bc42d286649ce.jpg", "a9b56bdb995e688b0dee406de0cf0381.jpg",
