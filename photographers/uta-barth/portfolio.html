animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Uta Barth</h2><div class="sub">1958– · 德国/美国</div><p>Uta Barth 是当代摄影中最安静的哲学家。她 1958 年出生于德国柏林，在加州大学洛杉矶分校学习。她的照片里经常什么都没有——只有模糊的光、虚焦的风景、窗户投下的影子。</p>
<p>她的作品探讨一个基础问题：我们到底在看什么？她的《视野之外》系列拍的是你眼角余光扫过的东西——那些你看见但没有注意的角落。她的《时间与...》系列用慢快门让移动中的人变成一道光痕。</p>
<p>她的照片不需要被"读懂"——它们只需要被"看到"。她说：'我想拍的是观看本身——而不是被观看的东西。'</p></div><script>var images=["0224ee8fd4b045b3b4f138c1dffbd3fa.jpg", "09aa31fba3bf39442ddd8804e469b808.jpg", "0b8728df38561aaf3806786bf2461189.jpg", "19833439500358445de8ffce2b2c3e57.jpg", "23b3dde894dc5d5d7d5c54c4bc4a78f6.jpg", "25587c11d824f31cf850216ccbba8f34.jpg", "34133dcfd0ca0e767ce6fd2840a1e032.jpg", "408ea7be8fad8ffffa2bc19f46b48875.jpg", "40cd0fee10be92105d79366cbb8e2115.jpg", "8090b0d078fda73fc249eaaca7f2d5b8.jpg", "81237f7db02eed3149517bec148ce2ab.jpg", "a01f00361467cb49c30738044d1f7309.jpg", "d2f0b5244b19322d8da1eb070aa68d7f.jpg", "d64cbeb95f9aef0896c9b016520cf220.jpg", "dc3d0569a173c2223047e45c52fa8ef5.jpg", "de49f78882b9f0b83af368ebee26cc4a.jpg", "dfd4aa62049ad1732303184168c583a9.jpg", "e0c742092a3cf24a70bbdf9742211f86.jpg", "ea93305e46cdc118d0cfd687a167ba24.jpg", "f34e0127e8e678e9dce89c43cb399f6e.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i-1);};document.getEl
