 年出生于纽约。她曾是《财富》杂志和《生活》杂志的第一位女摄影师。</p>
<p>她拍工业机械、拍大萧条下的贫民、拍 1945 年集中营解放的现场、拍甘地（在他被杀前几个小时）、拍朝鲜战争。为了拍照片她吊在飞机舱门外、站在起重机顶端、钻进矿井。她是第一个被允许拍摄苏联工业的外国摄影师。</p>
<p>她的名言：'工作就是我的宗教。' 她 1953 年被诊断出帕金森病，但她又工作了 10 年——她把相机绑在轮椅扶手上继续拍。</p></div><script>var images=["01d613f3f48435739cc01f5a27dcb1a0.jpg", "020f491314efa67cf5c9c2eaf902ad62.jpg", "030e87f814440832a5edc484b4a4247b.jpg", "07f7f52c8c1e9f510f3d3bbca024a81b.jpg", "08927eb6659abbb800c6663323ec14f3.jpg", "090f17f9cf80701cd29c74c4cc7dc313.jpg", "098ac01aae432f4b6de3d57be8844932.jpg", "0e6e776eecca182685108d5d128ad24c.jpg", "100df693130d95ac30543b84f0c58e11.webp", "101bcdcac6a785c3749a0b501f95075a.jpg", "10924567a0ad760d6b02eb0666f2a23b.jpg", "118160609b6b78cafa8151e1a68f4d56.jpg", "121a0f3c1cefaf34f0094b8cb4141e6d.webp", "13db285cf7cc27c531501c505ddf6834.jpg", "165bd63727428f29a7e963fa9dbc512d.jpg", "1a132e2b79e19157435a44ac32bb3763.jpg", "1a46d7cb6167fad8984c79402e302033.jpg", "1a67f7d9efea02715f5d17f23bad304f.jpg", "1ae405db416e871b1138f22499edc189.jpg", "1c6903f65619b196e9e3681704e86674.jpg", "1c8761e1b10db67c20a4714622811c44.jpg", "1ce27e7baac8cc0420280be21bf26cbb.jpg", "1f0d37376358907e461052018efa57d9.jpg", "20a4ac3ba7c58368200a710ae7453a99.jpg", "20ea78097d1e896895bf2c92a794c939.jpg", "215a4699600f87d37bf7922e71a58730.png", "21ceae84eb9120b4f55e35c11943a860.jpg", "23859eb8f3d1fcc44e7bfc2d8624541e.jpg", "23f3a7d9523076734cd68152a7657733.jpg", "241228bd19bde7f73f1a2aef3304f8df.jpg", "27af6549d511fbbecc915729fe9b0ff4.jpg", "2a059984887968062acd3cc0c1531440.jpg", "2e485f4cc3a030c3a52af7297af62976.jpg", "2f302426d030bff7166252b51c98b82d.jpg", "302c7ace5306a436f6b1dbdd51fb4b68.jpg", "30925fc781cf098fe10a405deb47a675.jpg", "33d5b1bd276f83af62989545db73d111.jpg", "34f34de7c2224827c7d6059f45a4589c.jpg", "359052d43dc38e96ca2503fb9461d968.webp", "36436632b3328c172733b0a19260ec1f.jpg", "371a7f52d53620967d91bfe9fbc0d3f6.jpg", "380c0cd8ca24365cdae0cd3723be24f9.jpg", "387e778056b4bfcd17f6222d6708713b.jpg", "3cdcefc9935dd9e57735ba6dbca4193f.jpg", "3d3d7c2e5cc23c7aef8fb687ece244bd.jpg", "3ed0fff8170f58c1f338ffcf6f830115.jpg", "3f65b6c0ff92aefbfe7e550b08135a68.jpg", "41dd2da638ba210cbb9ea
