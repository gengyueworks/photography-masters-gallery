然的影响。</p>
<p>他最伟大的项目是《极端冰层调查》（Extreme Ice Survey）——在全球 26 个冰川前架设了 43 台延时相机，连续拍了好几年，把冰川消退的全过程记录下来。他拍的那部纪录片《Chasing Ice》获得了艾美奖——2012 年他拍下 7.5 公里长的冰山崩塌的视频成为全球新闻。</p>
<p>他说：'我不是环境活动家——我是一个带着相机的见证者。'</p></div><script>var images=["0048eee4375227662744f3c549883ae0.jpg", "00e9ad68090271c7cb58b0515a90de8d.jpg", "0114d1ce3478e563803f05dcc3a6fd8c.jpg", "0225488d627d310623d2a2397ee690fb.jpg", "05eb1668459681a1d1042976023e4008.jpg", "06bccbd0b0d678e0fe9b35c61d01e1bb.jpg", "09f731e592de64c88c2b1ed54c65c51a.jpg", "0cf9b171be2fa57941bedaf574550cb4.jpg", "0dd151d8523342e7d8f598261f80f852.jpg", "0e2853a3a3f0a1c592786615073e47d0.jpg", "1046a5a2692bb2e83bde86bb88074c38.jpg", "11e0176ca9ea4bd654427843291cb51e.jpg", "12f4110c4550f9b02256f6c9f8331c53.jpg", "1bba3744a7784027e170edfcc90d37fb.jpg", "1df6a3b77f5af08359f0ad277f5a796b.jpg", "1fc2c5695e2c1777da4de94c1f97ecb1.jpg", "2215531a8a951dba1175e38eb0a3462e.jpg", "22cd9b47272c8e927834a49dada0055e.jpg", "31d7366b4041ef6274fe8a311c8f9f01.jpg", "38e6d9dff32aaa7d3baebebe9b248fac.jpg", "3c258aee1fa74e5571799231607a61c8.jpg", "3e712252d09eab70125119875e734daa.jpg", "3e77421aef8dd1b0b9f6f564aabd5244.jpg", "3faec5fbf275bc5d6fbe2c8abf7e2fc5.jpg", "41916fd758acc4f86b1415dd932e8920.jpg", "425c30f266c711cb22016ac8d9304281.jpg", "4390d38285fdd3759fca792cebd1d3b6.jpg", "450df8954672932ebae9c048fff39575.jpg", "49a292428ae4854f33abb4e58d7f24bc.jpg", "509cb85f044193115f8e467fc853a489.jpg", "569952f6ae5f4a1fa97643c8b0f68be1.jpg", "58da18cfac3b633a27da8f3e63229164.jpg", "5b69b2d2ff19d746280796b937de53c5.jpg", "5b95a8f916f29051acc2bf3581993cc5.jpg", "5e371fbfc62be6e2a9f3d239d0d5d219.jpg", "5e912d2bd7bb2adc84d8291dd85aba78.jpg", "5ea26245f9358e5dbe8ab1f64469aec8.jpg", "5feb812848e5eef44cd7e2c37e9913ac.jpg", "61dde7776a59b74b61d7a18ec3aeeb7f.jpg", "63a0cb1a957c8f3b09c8ccccfd1909d2.jpg", "643bae9b3b071f0f9e98cc7bae09afa2.jpg", "6499e91b7c17cc616229de2dbb131e50.jpg", "660861576a218463234841e24f3e31f4.jpg", "6a2f27e9aea9445fe0c0a92db49d09f3.jpg", "707b702d8971024a2e80cd9b42e30014.jpg", "742aa9eb06c1a7ab3b1f0edbd3891417.jpg", "7454d8ea43eb58dc8abf90419c19af13.jpg", "746e9c28b605386cea1330696b870d07.jpg", "75968febd0754c1b8f
