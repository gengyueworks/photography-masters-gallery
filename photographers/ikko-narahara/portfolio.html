换学生在纽约新学校学习。</p>
<p>他的三个名系列：在法国圣徒山修道院拍的《时间在何处》——修女和修士在石墙下的日常；墨西哥监狱的《牢笼》——囚犯在铁栅栏后的面孔；以及《人类的大地》——他在美国的系列。他的照片平静、克制、充满东方哲学的寂静。</p>
<p>他的《时间在何处》被 Cartier-Bresson 高度评价。他说：'照片是时间的一个切片——我要拍的是时间里那一瞬间的永恒。'</p></div><script>var images=["00403961bc836e71ef270d4b24c3e1ba.webp", "015aa9cfb76bebf6f181ae15460a25c3.jpg", "0178921dd1463f04d6ca2ade351da6ef.jpg", "02560451cb5a6dd80fe4fbdf14f8d15e.jpg", "025b286fcfff56275f412f00963bbf33.jpg", "02df18b1ac4df417b3b58e646a7ee45e.png", "03e93749deb55f1a0c1479ce834d6f05.jpg", "04338c4008a5cd1ed3f08c27ec0ca4a6.png", "08ad122c64e9bcfdb9aaca0797e8cd53.jpg", "09df013dfe48fbcf65f47072aff04147.jpg", "0aef2507ee9e8df11d3962e60a11bb32.jpg", "0c20f49dc1b28dae905c98e0b89a5e5d.jpg", "0c8ad19803568a8019ad1a4744c386a9.jpg", "0cd23b253a5061211db826cbb2dc0fcb.jpg", "0cec93e9041ed7e8ad36dbd17b2cc2a9.jpg", "0df0b5d7222f2a0affe602e2920377a2.jpg", "1353bb70ce78f9e69d3efdf6e83fac15.jpg", "1437ab712a84abf5ab31a1e784b88641.jpg", "148714f91e8062493d0fa5e9d2be46d2.jpg", "161bc185ef44d8c89fa9b32fe260997c.jpg", "169a1a8d0a38ad4f7071369bc1e40fe7.jpg", "1b72520981e71d2661e1b1e908b17bce.jpg", "1b8a260df3c70295f8ebd19e90ae6bd5.jpg", "1c4380bfdc90ed7b31c27a5284858cdd.webp", "1cd187b8ceb94d05ede633d4ccd69d1c.jpg", "1d2dcb79f66528e34a8ae8654311782e.jpg", "1d8f72a5f14b4864db2a5129a35e5985.jpg", "1efd50a7322a30bd3e4c538ba6cdb0a5.jpg", "2050b1923dd3e72b914332c156461a58.jpg", "22446d00e933ee3d0d0b5c8bbd2ad1a0.jpg", "2293809aaeecb3a080a0d6fcdcfc8146.jpg", "22bd88981f957ecdbfa52db007c603d9.jpg", "23c34c0bef4cc6ef2678b200fb58c334.jpg", "2406329120ff888214ee3a4c3d9faad6.jpg", "25429860b3d9e4d5313c825428878680.jpg", "26dc20a3a20739c1b4ae7c4492d66b48.jpg", "2745c15fa496502e94d64abaac7e18af.jpg", "2a09bf4b7345850a3626986f97d6e8e2.jpg", "2a3b2c278a08207be051dc370bda540b.jpg", "2b39b6779509536899a2be699718bee9.jpg", "2b9f65b4a6fdfe9b1d238e58cdfa6d4c.jpg", "2ba17ee854738a11090455d1e55f014d.jpg", "2c6f90a05956314867bf8dc460e4b48e.jpg", "2d80bb24d6f586e0d83b8a203bbfcc0d.jpg", "2dccb8ed43e51be574f8cf9d8d1eff80.jpg", "2f63ddf309bbcb28b11423f22093100a.webp", "2fd393011d7b08b1750466e7d00da2fb.jpg", "335205114c412b40c6
