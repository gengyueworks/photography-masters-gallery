>
<p>他的风格：极简灰背景、直接的眼神、把人物拍得无比巨大。他拍过普京、奥巴马、特朗普、金正日、伊朗领袖霍梅尼、中国历任领导——他也拍过美国各州的普通穷人。他的《权力肖像》系列记录了世界上最有权势的人，他的纪录片《The Revolution Will Not Be Televised》拍下了委内瑞拉的政变。</p>
<p>他说：'拍权力人物最好的方法——就是告诉他们：你不会吓到我。'</p></div><script>var images=["0983690dce5db289e43fc5853aa973c7.jpg", "0ae956e8a2c59dc876542cd2c3c84ebc.jpg", "0ca6e179ec13f56ab2ffc652a8883ece.jpg", "1a66299bec3cba2de1c42811e1770be6.jpg", "1d30260a765362a878b95e601b6f9c23.png", "29c403f272997d898890bb390bbf6302.jpg", "3b735a2dd981b44809b8904d9cdfdda8.jpg", "4d409820e79ed73f903639014ddbeb64.jpg", "4d914f0608bd5158cd612f1cfcb2c610.jpg", "5a4e9b971885cf79b7310b0e56648ec1.jpg", "692d442e510c6c996d4571d8785d6e8b.jpg", "75271b0e096966fc0fbbf3219831f7af.jpg", "8ad024655e8cd8fa73d3d6b6da508bed.jpg", "8c30312ebd7411244a7d43f682573f32.jpg", "8f807abc8a48d53d3087ab48f40f6378.jpg", "94118a31e29ad6b3911a190b103688de.jpg", "dce9718729113e005474f07fdaefad6a.jpg", "e46d2286c0c852488900aa114e59d278.jpg", "ed4a1fd04a27e16801743c8ed0e4cb56.jpg", "f8501478bfe6eb6d4eecbd50b43099ad.jpg", "fdb43c083c562891b6110ca50e8b666b.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i
