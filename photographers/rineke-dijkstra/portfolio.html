个人、一面墙、一台中画幅相机、几秒钟。</p>
<p>她的《海滩》系列拍沙滩上刚下水的青少年——头发还湿着、身体绷着、表情尴尬而真诚。她的《新母亲》系列拍刚生完孩子的女人——还带着生产的疲惫和茫然。她的美国高中系列拍站在学校走廊里的青少年——青春期所有的脆弱和倔强都写在那张脸上。</p>
<p>她常让同一个人隔几年再拍一次——记录时间在身体上留下的痕迹。她说：'我不摆拍。我只要给他们空间——然后他们自己会变成肖像。'</p></div><script>var images=["017f3da94e1de11dea984c95563cf59a.png", "01ae9ba1be23beec50a0a5ed1277fed5.jpg", "05b763f138286b62f4da6a98529fca8c.jpg", "069177fc2fc3b06dd4aaabca82dd9d0d.jpg", "06a42c0cad84bec3704beed137fdb486.jpg", "079f74356eb1c25c56715105804bd966.jpg", "08a42c5d1fdf6dfdc9a1178db006080d.jpg", "0924d2456518803b8289d7e6b8c908a2.jpg", "095c859eba5cc676dad8ce99f0be3152.jpg", "0a122d7cdf243ad87f9ff4206f02e167.jpg", "0ae5ddd3f8cb8e2ab94b611f39a6042c.jpg", "0aedc1b5341ca2a99e7050d30e2a7844.jpg", "0b1092efe52fe1ae6f74ba9bd09217fe.jpg", "0bdeb0eb0cb9d4e7d8f01f5a7b175a61.jpg", "0e650002b5b0f02b38097532d0503b11.jpg", "1062322580366fda2a8bee617c9050a3.jpg", "12bb8ac8d7e27d76b4b65f5116569d02.jpg", "12f9aecb4eef775141fa704998af43b5.webp", "163915ca2d471ac34f0d419d14439fd4.jpg", "18f16564156cffd6b313fb202b523646.jpg", "1c23a387112331f4337162e90a5a4a4f.jpg", "1e1fe17fbb2bda6ce4dd4061b6f1051e.jpg", "1e255ba8d68061e40ad0b67e0133c831.jpg", "1ee85164e0440abcb630fff3a360fa57.jpg", "200c6b658d34402f1054a177f78f45e7.jpg", "261e5ee27e627f841a29a84cf4ffcb66.jpg", "26925a90b7de5cb8247884f1e565afbf.jpg", "2ba4781da8d578e20c5848b5d918ad81.jpg", "2c4ad34ab5dd9171d059c36cafc3bf43.jpg", "2d866ac1ce90880375080e40a6058d82.jpg", "2e8dbf4c2031e2bacd939315d078bb53.jpg", "2ed57bfd11a724a3d5acd297855d6751.webp", "2fbcb81ee6ad422e482367b64fdffa48.webp", "30dea262982f981d7122e121aac9d77d.jpg", "30f8ad6ab8291d570f5c8f6c3a695405.jpg", "3204c3c1529d80e9ee6d88cce2d4422b.jpg", "3227a2011da54720cb465565fc8b8922.jpg", "32bc3412a27dcecb88bcee12a2a7ecb7.jpg", "35c1251ae4720bc13b50c3f007853bb5.jpg", "37c76f6262cb62a805e7573dd91eb3ee.jpg", "3841dfa1e45bed541594e92440f7d6c6.jpg", "38b22a500b2a6fde34b541a8150b67dc.png", "3a5120931af355dd88a94b4466e116cd.jpg", "3c98dc64612902a0dea1858e2ce48187.jpg", "3e39a11f08b52b5410ac5c54fcaaf89c.jpg", "3f07c39afda74c86ca62e06b54473669.jpg", "3f11593ddd6f696284dab921dcb82884.jpg", "4063fc909b0992cff92dd
