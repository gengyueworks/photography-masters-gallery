function init() {
  document.getElementById('counter').textContent = '1 / ' + images.length;

function buildFilmstrip() {
  var strip = document.getElementById('filmstrip');
  var maxThumbs = Math.min(images.length, 200);
  var step = images.length > 200 ? Math.ceil(images.length / 200) : 1;
  for (var i = 0; i < images.length; i += step) {

    thumb.className = 'thumb';
    thumb.innerHTML = '<img src="images/' + images[i] + '" loading="lazy" alt="">';

function preload(index) {

}
function showImage(index) {
  currentIndex = index;
  var display = document.getElementById('display-img');
  display.style.opacity = '0';
  setTimeout(function() {
    display.src = 'images/' + images[index];
    display.onload = function() { display.style.opacity = '1'; };
  }, 100);
  document.getElementById('counter').textContent = (index + 1) + ' / ' + images.length;
  var thumbs = document.querySelectorAll('#filmstrip .thumb');

  var thumbIdx = Math.floor(index / step);
  thumbs.forEach(function(t, i) { t.classList.toggle('active', i === thumbIdx); });

});

document.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', function(e) {
  if (Math.abs(touchStartX - e.changedTouches[0].clientX) > 50) { (touchStartX - e.changedTouches[0].clientX > 0) ? next() : prev(); }
});
init();
</script>
</body>
