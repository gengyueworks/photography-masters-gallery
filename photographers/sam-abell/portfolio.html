喜欢在画面里加一个"框"：窗户、门洞、树影。</p>
<p>他最有名的作品拍的是日本——京都的茶室、庭院的枯山水、穿和服的老人。他的照片安静得像俳句。他也拍过中国、西藏、非洲。他的《Stay This Moment》被公认为最经典的摄影散文之一。</p>
<p>他的技术理念：'先构图，再等。让世界自己走进你的框里。'他拍的照片很少用长焦——大部分用 35mm 拍环境肖像。</p></div><script>var images=["00bb9e500253dc3efcc77d7271da5429.jpg", "01c12b46c008c6b5af44587dc452b3e5.jpg", "02f3c466d00a023503ae4170c1aba80f.webp", "0359258a33763ea92fb451d3d72cfc12.jpg", "039e4838f1236c6c340c85d285413098.jpg", "04e8ed54ce8f6c1ee54233ee6696cf40.jpg", "04ebb36c43aa02219968dc45b219e478.jpg", "07e5aba548f0766101bbbd0b8484459a.webp", "0a18a2ab3c3c19730562c8a399fd0ef4.jpg", "0ad86e098baf8262bcdc4822367cc08e.jpg", "0b106507e56f910f470395ac1bfa4b3a.jpg", "0e4879ae5dbe4878b6a8decc46e3eaff.jpg", "0fff73ffb23566ad7736dc8fb4feee9c.webp", "103011ddc5a23e5fd91c755024fbbe29.jpg", "154b6a4d90068076788d1e34789eac14.jpg", "1871192a1772f42ccc1e25155069ace5.jpg", "1bdc77625d2cef10d8ffb1765676c49f.png", "1c02cf1c64484269e184139c71e2d264.jpg", "1d5dd57e3ae28cbdeaa82833a59f42a1.jpg", "1d8945c836c294dcd9ffd9f2530f375c.jpg", "200c1d19ee4115cb1dd0ea1f8b8b146d.jpg", "20c755b925262535066222986aa81e53.jpg", "21a2aaa3dd1c62bcd7f5b2f9503048b2.webp", "256daa65f0db943b9d13a305ceb60f8f.png", "26e6883a2014d224d6eb233e8098ee21.webp", "2795300a7f9387102c071e1a027cf92f.webp", "27d55b629bfabe83d84387f796a06aa1.jpg", "2b5821793a9910fa95fa9dcdd588c395.jpg", "2c270dffdf2bd241c25d2eab05589e0d.jpg", "2d03a246f4ebbd95b242c5c2d30d5aac.png", "2ea5d59dbbcf1c364f57c79aad27c57b.jpg", "2eaf74a33b36be70c5011aa521d5e345.jpg", "2fa44b95836fa53578832c5fc34bfa6f.jpg", "31467ab210b444ff2d9eda39c9854c95.jpg", "3242ad9b07ad4b48b6cb242206d09cdd.jpg", "328cc9ec64882bd6e805e820a180585b.png", "333e2e3d0b3934204b1eda55af9d90ff.jpg", "34e72e8ea3d9d5737192b2eef74f2d20.jpg", "3606ccf8ec260b1576e51a4861b09895.jpg", "36515f9ecc3e8cb02ad12c2f5945c3d6.jpg", "37169ba4678d77cf0c2b052bd9930aed.webp", "3751357ce70f8c47799130bae9e88efc.jpg", "3772c8b877d806a164595f7fe112a2d1.jpg", "3c29b9a657a5b36c610e7e6fd193fed6.jpg", "3db84cb3a495a2104683c942cd00bed6.jpg", "4135b6d308c3bfc70ca05bd6c35bba53.jpg", "42bc0b85831715244b24f672b4a08951.webp", "42c1aed7bea39be7e6343b
