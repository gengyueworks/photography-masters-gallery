<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Michael Kenna · Portfolio</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none;-webkit-user-select:none;cursor:pointer;}#main-image{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}#main-image img{max-width:98vw;max-height:92vh;object-fit:contain;transition:opacity .25s;}#counter{position:fixed;top:24px;left:50%;transform:translateX(-50%);font-size:14px;color:rgba(255,255,255,.5);z-index:10;letter-spacing:2px;}#filmstrip{position:fixed;bottom:0;left:0;right:0;height:80px;background:rgba(0,0,0,.85);display:flex;align-items:center;gap:4px;padding:0 16px;overflow-x:auto;z-index:10;scrollbar-width:none;}#filmstrip::-webkit-scrollbar{display:none;}#filmstrip .thumb{height:56px;min-width:56px;flex-shrink:0;border-radius:2px;overflow:hidden;cursor:pointer;opacity:.35;transition:opacity .2s,transform .2s;border:2px solid transparent;}#filmstrip .thumb:hover{opacity:.65;transform:translateY(-2px);}#filmstrip .thumb.active{opacity:1;border-color:#fff;transform:translateY(-4px);}#filmstrip .thumb img{width:100%;height:100%;object-fit:cover;}.nav-btn{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;border-radius:50%;z-index:10;transition:background .2s;}.nav-btn:hover{background:rgba(255,255,255,.15);}#prev{left:20px;}#next{right:20px;}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#000;transition:opacity .5s;}#loading.hidden{opacity:0;pointer-events:none;}.loader{width:32px;height:32px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Michael Kenna</h2><div class="sub">1953– · 英国</div><p>Michael Kenna 是当代最温柔的风景摄影师。他 1953 年出生于英国利物浦，1970 年代移居旧金山。他的照片全部是黑白、全部是长时间曝光。</p>
<p>他拍日本：京都的竹林、北海道的雪树、富士山脚下的雾气；他拍中国的黄山、意大利的威尼斯的雾、法国的诺曼底海滩上的木桩。他的照片有东方水墨画的气息——极简、留白、安静。</p>
<p>他的拍摄时间是夜里或清晨——长时间曝光让云和水变成丝缎。他拍同一棵树几十年——看它怎么在时间里变化。他说：'我想拍的不是风景——是风、雾和时间。'</p></div><script>var images=["114704d0bdbadc5a0e2c92c9d7dc1a9e.jpg", "175ec10546117272d1672223460dec50.jpg", "1e42d2420eac60e3fbe3b60e47d45777.jpg", "47f053c35150cdc853b581dbf72cd338.jpg", "5f312bad6dce6b673ce3a9320ce1e9b5.jpg", "6012606f5f728091c9c9f3c0e2ae4cea.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i-1);};document.getElementById('next').onclick=function(e){e.stopPropagation();u(i+1);};document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();u(i+1);}if(e.key==='ArrowLeft'){e.preventDefault();u(i-1);}});document.getElementById('bio-btn').onclick=function(e){e.stopPropagation();document.getElementById('bio-panel').classList.toggle('open');};document.querySelector('.close-bio').onclick=function(e){e.stopPropagation();document.getElementById('bio-panel').classList.remove('open');};</script></body></html>
