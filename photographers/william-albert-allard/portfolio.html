尼苏达州。他 1964 年加入国家地理，用彩色胶片拍了 40 年——在彩色摄影还不太被纪实界认可的年代。</p>
<p>他拍的是"正在消失的人"：美国西部的牛仔、秘鲁安第斯的牧民、瑞典拉普兰的萨米人、巴斯克山区、意大利的多洛米蒂。他拍的人是骄傲的、有尊严的——即使条件艰苦。他的信条是"慢慢来"——一个选题可以拍 3 年。</p>
