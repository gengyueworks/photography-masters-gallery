家地理》拍摄水下世界——至今已经拍了 50 年。</p>
<p>他的照片几乎都是"两栖照片"：水面一半、水下——珊瑚礁上方的天空和水下的鱼群同时出现在一张照片里。他拍大白鲨、珊瑚礁、海龟、鲸鱼、被淹没的沉船。他的照片让陆地人第一次看到海底不是一个蓝色的模糊——而是一个真实的世界。</p>
<p>他获得的荣誉包括国际潜水名人堂。他说：'地球 71% 是水——我只是拍了大多数人没看过的 71%。'</p></div><script>var images=["01eca5f7415efd35a2511293a10348cb.jpg", "0221f6cd5eefe3c9704c0f2cecf7de1d.jpg", "024c79061d2445f5710be51419a827b3.jpg", "049140ab4e8a0e6177383acf9df2a360.jpg", "05e1fdfa7ac00ef2f3aa2e6115c98b5f.jpg", "0999de4e2e7ba8bfd32c638eb125838f.jpg", "09f731e592de64c88c2b1ed54c65c51a.jpg", "0b49827a717b4e1953ba7f4c404710e0.jpg", "0b85b5d64cd175d79cd82ba1d4819d86.jpg", "0e1013ff60b33c8f80703336bf8ad563.jpg", "1364f2a234da4d45f8696635cec678b5.jpg", "195993c6fc60b99d86912294b33d71f6.jpg", "1bba3744a7784027e170edfcc90d37fb.jpg", "1c4e928fd97679d592c5d44a04b959a0.jpg", "1ecb6c96a5f48a4d4ef790a66416bafe.jpg", "2357d55c48ed8ea815118c889ca80ded.jpg", "23aeb813a2ff3c2860839df9a19a79a2.jpg", "270cc55c33d7e2b69990ed64a9cef06b.jpg", "284541d100f6ebdb3c101baa022469ed.jpg", "28ca1d653fdf2c7bbb1fec59598fb17f.webp", "2a3c4f4c9f733103a9c3451063fe1d44.jpg", "2beab1101478b07ecf8aabd043915a58.jpg", "2d431faafa1ca8184703a7275620a5e3.webp", "2e49dcd9e2f3b5f7e092aaa50982080e.jpg", "30c98019abde350449cc4c053744da18.jpg", "366fefe6ca2943603d39cef0506e194e.jpg", "392ecdca2af9dec39b151c73ff0c5ba8.jpg", "3c6c8338f4558f9d47717b5a498b9abf.webp", "3f1f2c4369bb43967d7c2e4e189ceebf.jpg", "42e527eec8ca1e2f442afd0a0569e5fa.png", "4879c6757d5a49c41b10732a32647bad.webp", "4addeb7eafdbc53853436ce7e64d6c66.jpg", "4b8d1ad24db43c02a4b665f7bd989b24.jpg", "4d04c4dc16904dbf63d8990104df3a24.jpg", "4e6c0c82a83146dc7daa30ec29869ac5.jpg", "4fd0bcc39e6e15ceacb876ac8cfdef51.jpg", "58978fa0cf7c6dafccd597b7c3a4ab21.jpg", "598878671d5aa0d7de6a279ed6aa30df.jpg", "5be8e1596ee63bc9c284583058d06939.jpg", "5d490742f4936468f7886acd12d45fb8.jpg", "633add3db8cd37394c4c2f28efb1c85d.jpg", "63baef06a5d142e3ba991ca634874231.jpg", "6514899fdd1db483987f1624c439889b.jpg", "677bd01118b53d63fe882f32a3dec33f.jpg", "6d4d44afe1d4f67830d60d9b4690d853.jpg", "6d51d3da7d180fcd2bb4c0ea2a0628e8.webp", "6e7a2beea08957356b415ce9b3a2df09.jpg", "71acae3bc16a2f815fd511c3cac672a
