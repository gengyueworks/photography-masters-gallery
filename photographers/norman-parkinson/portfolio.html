ogue，把时尚摄影从死板的棚拍变成了户外冒险。</p>
<p>他是第一个把模特带出摄影棚的时尚摄影师——把裙子带到海边、沙漠、城堡、飞机上拍。他的模特永远在动：跳跃、奔跑、大笑。他拍了 50 年英国 Vogue——从 1930 年代到 1980 年代，几代英国名模都是他拍红的。</p>
<p>他的名言：'时尚摄影是一场狩猎——你得追着光跑，追着风跑，追着模特跑。'</p></div><script>var images=["045c5a9ef30bb0ef0678e2878b288faf.jpg", "1d3714a06ef7963171e3b9d4cfc04cfc.jpg", "308727caff035c176322e8a5a4fcb0e8.jpg", "3321ffc1765ce8978ad872c9327db31e.jpg", "37d709788eabfab4354b98dcea3c14a1.jpg", "40eed4c61588065a9d22b5315417586c.jpg", "5293f5595afb4ee3e88fd478334e4e5b.jpg", "5abe41b0b7a1d7126c98313a50e3cf47.jpg", "5c1fe1504b45226106d50f42dc4ac0ec.jpg", "6c36a8699ffc22a635aa101f3716380d.jpg", "753d1bfb23491f9c4aff9687718bf67d.jpg", "77386475c1be4bb27019007deac571b6.jpg", "86ff17d008d011a3dc401eb47c2a769a.jpg", "b204644a234ce78d23a2cc348b0a6cd7.jpg", "b70bc60211365c242389adbfb23b2134.jpg", "ba86d19140265bfac658d485e8617705.jpg", "c3576d51ef1aa8102e71d28eeb73564a.jpg", "cb94d531165cb93bd9f70a23a7f02426.jpg", "cd65bf3fcba88fccbbc0e72c217304f5.jpg", "d7e34e7c537c6730514bef4884e51ea4.jpg", "df8313ef1a40d84aad93493a7dd73d84.jpg", "e7fa5f1738a5c1ecbc28a9ea073e7e61.jpg", "ef87a3f45f493440b4b2ec36ce17018f.jpg", "f5386b4f0e0995651cafd11f52c6f158.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-b
