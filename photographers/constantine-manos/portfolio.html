于南卡罗来纳州查尔斯顿的希腊移民家庭，晚年常住希腊。他 1963 年成为 Magnum 成员。</p>
<p>他有两组代表作：《希腊肖像》——1960 年代拍希腊乡村的婚礼、集市、节日——黑白、古典、带一点幽默；以及《美国色彩》——1990 年代在美国拍的彩色街头——色彩饱和、构图机智、充满意外的巧合。</p>
<p>他说：'我的相机永远在寻找两样东西：光和笑声。'他是摄影史上少有的把街头摄影拍得如此欢乐的人。</p></div><script>var images=["001881fbc2d314be31f2f0f6ed5dd8ba.jpg", "001b0a1407e9ddb819bf1aaffa77671e.jpg", "00d8eac5e97757b7aa368bb19ad64570.jpg", "02476f62cc0825584776538dae771d21.jpg", "03df466f798f3a6588f95d3cfd16ad7b.jpg", "03ed36b711f157d51773ed5a50c86d8c.jpg", "041618aad352a6d8e6f70b6008138547.jpg", "04bd97f160185faf60123c1e2a8c6957.jpg", "0569492e72c5862b0030b44df07c2ca4.webp", "06731fed738deaee87dce77ceba15fa3.jpg", "09856ea19ae2f2ec86ec160fb2348df8.jpg", "0aedc9ea5f770f1731672bd1b134b828.jpg", "0b395469e7c5b1ff8ffaaa8252b9d410.jpg", "0c7b5378247ca25e0484ed22efbed70e.gif", "0d474731e06b4b926ba76b29ba12ee68.jpg", "0e17a06fc37d0c22a3bb4e092eb0c209.jpg", "13e24ba1f18890351349696f88b2a562.jpg", "142fa15e2dc4e2ca9b21a6ddd01112e8.jpg", "15352977a5e3da78459e1165249d710b.jpg", "163320f3c94d528969068e849fcba338.jpg", "180fec45aef472df7b38e9ee7d03221e.jpg", "18a566e75a789869efc0120f1169bebe.jpg", "18e6e6275d92c2c637708beefe652673.jpg", "1951b898f07255e467ac147bf92133d2.jpg", "1a7f67b61858fbb5471598ddd1aebfa6.jpg", "1d628bfe5940bd28bd4dbbd4743aff10.jpg", "1db66c2f7229dbee0efdb87c5e5f4f73.jpg", "1e0461276c5589d9daf049c6ecd99e4d.jpg", "20115d28f47377deb42a513777e65273.jpg", "2204821eb75b3c1d2a31afe84a4eb099.jpg", "22109e8b3ca36a2a520bbfa1b6ff0469.jpg", "23f5db150dd0b6a343306342b2846902.jpg", "25285830c6242bc9a6bec18f4fcb4e57.jpg", "256801524ea3879bf5b8ef3cfb0fd837.jpg", "25cb80454d1f17dfb9f3f6ae01098e18.jpg", "26f8148dae3b845c3350741833a81a42.jpg", "29baffd8693e21a9c63121f25fbbe72b.jpg", "2af8a26768a33384e8742ca0ef8dd8e3.jpg", "2d3356c7ae8dd03b4dc4f4ea6a41d013.jpg", "30f37e61e8cbea3b0fd0c917c3ad2a94.jpg", "31a3c976b780365a7e8fecebaf7350b3.jpg", "321a37b4a7f2199cc41f59c53b4e1aa5.jpg", "3252e60fdcc9713e4107243229dd4ef4.jpg", "327d1970f3431acdc44ede14bb321ca5.jpg", "336967ee825d9285a9fb13c56cc51989.jpg", "3409b52ef28f7e70ceaa22449c64fedb.jpg", "3560fcd36dca2acce9ed40d5b26ad139.jpg", "3719c76fd72ecf4adb5c61d9db1a1f60.jpg",
