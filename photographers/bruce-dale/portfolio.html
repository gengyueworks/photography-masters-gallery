;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Bruce Dale</h2><div class="sub">1934–2022 · 美国</div><p>Bruce Dale 是《国家地理》历史上最全能的摄影师。他 1934 年出生于美国。他在国家地理工作 30 年——既能拍商业广告大片，又能拍极限运动，还能发明拍摄技术。</p>
<p>他最有名的作品是 1974 年的《Concorde 协和号》——他站在协和号机翼上拍下的那组照片，让全世界第一次从飞机外看到超音速飞行的画面。他还发明了微型摄像机装在 F-4 战斗机尾翼上拍机动飞行。他的摄影跨越了地球 120 个国家——从南极到撒哈拉。</p>
<p>他说：'国家地理给了我一个要求：必须拍得比任何人都勇敢。'</p></div><script>var images=["00290b22ebd7d53c8c93f4ef70c36f28.jpg", "014c1327f0fd91531b76f03d222894d7.jpg", "05c9b4a0499e83fa8e0d71197c632bf7.jpg", "07d65efc0603e6b6c4b9d72649c0de44.jpg", "07dd50d0dd7c40d45c2368721851212b.jpg", "07f732962d22702d1ec80fd6ef5a1be5.jpg", "094153d8d8d3cde9c15749d606a96225.jpg", "09af336bb30b7ac07ce4580d0a157b57.jpg", "0ae2e233d4191e177e54970d328fa600.jpg", "0b2726cc5b29180d727e247a1dc978a5.jpg", "0bdbcb4d84c3317111365ec68c0e2136.jpg", "0c61512e56be6fd166eb8748f553f9bf.jpg", "0c8c9030a95d42b70895fe43794bf47f.jpg", "0ccb36ec7f21ad54ebaa3c0ed30b54ac.jpg", "0d935745e41e5930a18a8f156c6e518b.jpg", "0e44ad14a734be3e650aa228dcc2d1c7.jpg", "0f76785d60fa7863e54d1e31fcd3d2f8.jpg", "112cb4ea8b4dc8c778e84e878360c8ca.jpg", "128b958314889378ab4539b33405696a.jpg", "132dc6b8c37fa0ed4c42a91ddf50ae7a.jpg", "14c226c13b46d57776bbaed492900f8d.jpg", "15aa21c1f116b83b5c6eb977d2ee7dc5.jpg", "15b4dcf8863bc02b94b1c184b0658165.jpg", "16c1a04a1ffdcaa4569f5beb5de1dfe3.jpg", "1877f7353de0db04b3afd25881b1ba0a.jpg", "189cf6676b13b9855fc3e022b8997608.jpg", "19ae093cf0a48acad02f6cf21e1bbabe.jpg", "1abe1c76dad7bae61330440879e30c58.jpg", "1ac272b85458317ef08b2287d1029551.jpg", "1aea3cb2ad110beed73b9d06c1993feb.jpg", "1be4f95be762a80605e6c694cd65745a.jpg", "1c20085e781a8de4af0a7d3d56fe92d2.jpg", "1eefec29f0af9fc679ad4ce2d1cf50bf.jpg", "1f95777a29a34abcad65a42addcd2497.jpg", "224792964a1fe1f76a889aba8eb74ec8.jpg", "22f0a4f058666f50b0491e89b70ae534.jpg", "235cfe5e0d35e2ad61838fb1d6f57be9.jpg", "236edcc8d09ff3ed2f611405eee45574.jpg", "23fc4f07e8a59a9d49381c96a5fafe8f.jpg", "24df8010728faa7825b79914565c7642.jpg", "2527654c44b2023aeda551bfcfa1668e.jpg", "2562179827e6ebf7ad8e250122aa8588.jpg", "27129bf0b32afe21412a247ff85c149b.jpg", "271ffc79d01ea873de36af60dd2ec5e1.jpg", "2768af7c9d399a74d633b456fd05f251.jpg", "28d38ae9c253309eb16137a8ebaa7c80.jpg", "295dc3b856db061625f4ff805852d655.jpg", "297cde3e0638b593d27271d3aecb92d7.jpg", "2b634b64b995e6af9
