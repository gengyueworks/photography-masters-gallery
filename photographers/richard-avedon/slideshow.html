var currentIndex = 0;
var preloaded = new Set();
function init() {
  document.getElementById('counter').textContent = '1 / ' + images.length;
  buildFilmstrip();
  showImage(0);
  document.getElementById('loading').classList.add('hidden');
}
function buildFilmstrip() {
  var strip = document.getElementById('filmstrip');
  var step = images.length > 200 ? Math.ceil(images.length / 200) : 1;
  for (var i = 0; i < images.length; i += step) {
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.innerHTML = '<img src="images/' + images[i] + '" loading="lazy" alt="">';
    thumb.onclick = function(idx) { return function(e) { e.stopPropagation(); showImage(idx); }; }(i);
    strip.appendChild(thumb);
  }
}
function preload(index) {
  if (index < 0 || index >= images.length || preloaded.has(index)) return;
  preloaded.add(index);
  var link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.href = 'images/' + images[index];
  document.head.appendChild(link);
}
function showImage(index) {
  currentIndex = index;
  var display = document.getElementById('display-img');
  display.style.opacity = '0';
  setTimeout(function() {
    display.src = 'images/' + images[index];
    display.onload = function() { display.style.opacity = '1'; };
  }, 100);
  document.getElementById('counter').textContent = (index + 1) + ' / ' + images.length;
  var thumbs = document.querySelectorAll('#filmstrip .thumb');
  var step = images.length > 200 ? Math.ceil(images.length / 200) : 1;
  var thumbIdx = Math.floor(index / step);
  thumbs.forEach(function(t, i) { t.classList.toggle('active', i === thumbIdx); });
  if (thumbs[thumbIdx]) thumbs[thumbIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  preload(index - 1); preload(index + 1); preload(index + 2);
}
function next() { showImage((currentIndex + 1) % images.length); }
function prev() { showImage((currentIndex - 1 + images.length) % images.length); }
document.getElementById('main-image').addEventListener('click', function(e) {
  var rect = document.getElementById('main-image').getBoundingClientRect();
  if (e.clientX - rect.left < rect.width / 3) prev(); else next();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
var touchStartX = 0;
document.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', function(e) {
  if (Math.abs(touchStartX - e.changedTouches[0].clientX) > 50) { (touchStartX - e.changedTouches[0].clientX > 0) ? next() : prev(); }
});
init();
</script>
</body>
</html>
