半生转向拍"自然的希望"。</p>
<p>她的转型代表作：中国四川的大熊猫——她获得了罕见许可进入卧龙保护区，拍下大熊猫哺育幼崽的珍贵画面；还有肯尼亚最后两头北方白犀牛的守护者——拍下饲养员与犀牛温情的清晨。她 2018 年被《国家地理》评为年度摄影师。</p>
<p>她说：'我拍过最黑暗的战争——也拍过最温柔的守护。选择拍什么，就是选择相信什么。'</p></div><script>var images=["0257d50a7c67867e8c993775c1f76bc6.jpg", "02e66cb9399c158f4f05a705b02928ce.jpg", "0402142167728ae9f2cc849a6f6e7c21.jpg", "04f475a796f6be7b3089421431ebebb4.jpg", "0b6e83dda5f5b0d05525191acf4e3ea9.webp", "0dce3f88b99e50498a0ea38f7a23864f.jpg", "0f45da5957e3f338ecb8a86781836311.jpg", "0fd871b6849dc400869aaf948499143d.jpg", "113e73828e3c8b9691b833998b70d9fe.jpg", "114587b040d1651fa796299b79a98ace.jpg", "15033d0ba807bfa780a4eb4bccba7cf5.jpg", "15f53d406a5226c414abbc688483ee36.jpg", "160f568d49fd0f0cb357c7e4bee7c9e8.jpg", "1965a7732f5fb6cf2b2a17addcdbc127.jpg", "1f2a70c6a18e8ac1929f700853e76ee3.jpg", "1fd7fd487c4ae673143a5c265ffad397.jpg", "210cd89ca09376ff08c4b86398e417e0.jpg", "218abe001460bdbb400fa7bc8a29c404.jpg", "21e2fca0b319d15a64d5c7348785f3b6.png", "22a39f5fc7d08079450db4b990fba63a.jpg", "22bfb84dc46adbc5148fd038a7157299.jpg", "26e3531522d4fd7ce512b08925c534f5.jpg", "2930011bb6adb9f8a0a8446745a6c7e0.jpg", "296e9820f8da28a6b583b6911000f117.jpg", "2bb0ac8cc193f52ba15039eef9df1b5b.jpg", "2bf72001e4450125b8f186dc3478713f.jpg", "2dd3549ddb57756fcd8dcbc435d69d13.jpg", "2e3696e59ed328260066a572f40aceb6.webp", "301a7c52c5bccd6f14283694a63d77ef.jpg", "30a3bda06fd04624e63fdd1b28a51de1.jpg", "30e9f4719d49e017ba0f13c8c6faae29.jpg", "3215f75b7c94ed53ab51b521aa0335b9.jpg", "32590768e955f0b441bbdaa5ae310a31.jpg", "349b7588f0dc66a110c40a28b7618a02.jpg", "358dac486def9bbcd40fb22a23e9ef38.jpg", "388b89d003750768611c2488db8c590a.jpg", "395d0db5991f7a7847f1335eb3e6ad3d.jpg", "3bf4cc3a2382af749fe56fc8e1311cb1.webp", "3e2c7289779b6f6d21856dbfc761e9b6.webp", "3e60f5bfa17d93605795456c578605d7.jpg", "3fdc2c7bf5ad68be1816c6bb125d9844.png", "42090f8a9bf4e4dd7a35da587a21a05d.webp", "4255a4152ce113ef5c1025c510628de7.jpg", "430910b8e64899f79cd87d3f58c51dae.jpg", "4367dba34a66fea65d19d75224265d3e.jpg", "43681b033e0e2c341d8a2f2b45d66c3f.jpg", "43835a20583d9c38aeb4c6bb2a60da82.jpg", "445592458ff3c2d8717a7f08d89180c6.jpg", "
