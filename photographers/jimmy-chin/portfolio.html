岩照片"，而是他亲历的攀登。</p>
<p>他拍过优胜美地的酋长岩自由攀登、珠峰的无氧攀登、巴塔哥尼亚的雪峰。他执导的纪录片《Free Solo》（徒手攀岩）获得了 2019 年奥斯卡最佳纪录长片奖——他一边挂在岩壁上一边拍摄 Alex Honnold 徒手爬上 900 米的酋长岩。</p>
<p>他说：'我在拍摄之前，先得自己活着回来。我的照片都是我先到那个地方、再用命换来的。'</p></div><script>var images=["0053e650232ea76e97d2aa201b8f55bf.jpg", "01147b0ebc16ead64c20d94aa1ceb191.jpg", "024335ff972149b0a95a442994ad31ed.jpg", "03d263248bca86d38dc74b896418b399.jpg", "05691aacedf7bc273dc2c88b56de30a3.jpg", "05704b34d61f25c2b0f6568353974dff.jpg", "05d35929f1a0908f47f1f41ae977733c.webp", "0681e02b00a9a1a58bdd205d91fd555c.jpg", "0768c0c5223129d18cebc8e5bb12085f.jpg", "09021a9284eefaad1e7939d99aa2f51d.jpg", "0a821f43ee83c31c610489b25492dac4.jpg", "0c7ff078e3e8fa9f41054e3b31ed8a8f.jpg", "0d3ab785c269c327bae92d4217c3913f.jpg", "0e24d7e7c1b1bfddc160df861188d4db.jpg", "0e4628d5702e509f45c46c9fef02dfe3.jpg", "0fc07a3a00781e24fd118948d30faa12.jpg", "0fd38e3dae0edd5c1b61ec07e3b8aab9.jpg", "114bb5d4dd079949d16078aa9f250b14.jpg", "13ebe7208612f94b76277295aeb20be2.jpg", "13fc3a185b92341c3e48023c7356d5d6.jpg", "1a7d43362e947c548ec55c7aa955b0d1.jpg", "1adabfd1dd041cc87623818f8eb426e9.jpg", "1bc7c25e259010b040adae92b36ba64a.jpg", "1ec37166c00d45232eee6a2c1d62c4af.jpg", "1fa8f4996154349e96e5132595d52394.jpg", "22d990f28a6f00eb9abdd5c2ba07185c.jpg", "22dd693bd9330559fbf1a9513b6f9124.jpg", "22eee8a3edea129bd173a04e2cb4ba5a.jpg", "27a075f8e92c58b6c4dd4757f15977b6.jpg", "296d82916e12a8e90bbf1629fcb8145b.jpg", "2b30027082a7f0b846510b46ab88e6ae.jpg", "2b5ba5d37e2403d14aa7d2770a25a541.jpg", "2c6110d9b23aa06ddb609c631471272c.jpg", "2d456affdd9cda9903005d50dcde1b3d.jpg", "2d8090f1fc5601aadf38571cbac85fc6.jpg", "2eaa0e25669578ed857bc9418d4f0713.jpg", "2f98ace54db3b6a6a54dfff47f0ad8ef.jpg", "3605a47a4ff7b03e12f4343cdfd89eae.jpg", "3623455524689d4fc241d7147efe8fe7.jpg", "363d1b34422dad8b5cdb5f8df64a160a.jpg", "3709cf849e6751c77d9b6c9fdc0c40da.jpg", "3938a4511e2ba61d34b7c806decd5be1.jpg", "3b9d268621907f31fd3cff6ecc668558.jpg", "3c18ab15d8cc26837d5f26a9799cee41.jpg", "3df37dede471041422f2bc868ca7ced9.jpg", "3ec5f68b9958a202bb12c52adf91cd83.jpg", "3ef39d92598270e108451040055db1af.jpg", "3fba79e31357ac65a822301286831f77.jpg", "41a
