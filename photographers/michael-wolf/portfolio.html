0%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Michael Wolf</h2><div class="sub">1954–2019 · 德国/香港</div><p>Michael Wolf 是拍摄城市密度的大师。他 1954 年出生于德国慕尼黑，在香港生活了 20 多年。他的照片拍的是香港——但不是明信片上的香港。</p>
<p>他的《建筑密度》系列用长焦镜头压缩香港的公屋大楼——几百扇窗户挤在一个画面里，像万花筒。他的《后巷》系列拍香港后巷的杂物——晾衣绳、旧冰箱、蓝色的桶。他的《东京压缩》系列拍东京地铁里的上班族——被挤到变形依然面无表情。</p>
<p>2019 年他在香港的公寓里去世。他说：'城市是人类的栖息地——我想知道我们是怎么挤在一起活下来的。'</p></div><script>var images=["0e6219aaba74698d8c35a6e016b973dc.jpg", "2bcacbd5c6e157e1cc079a2519fdc420.jpg", "3c795ffe39cfd70a56149f4f2f1fb3b6.jpg", "50ed9418e1db7fd39b7d9e99f944a424.jpg", "6e7cbb1e0c2ce2f1f16b23717ffe6ea5.jpg", "ac6ee8c51c41ecb68f5b2701a2237cf4.jpg", "be8122b2b824faf2fe3d0f2791bb1a2f.jpg", "d4e03ff8f5ff59d1b2522e170c24560b.jpg", "e5b4564983b5a0eec0af30078d06dcae.jpg", "f84c7b1673e06a47016a0dd8501c510a.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i-1);};document.getElementById('next').onclick=function(e){e.stopPropagation();u(i+1);};document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();u(i+1);}if(e.key==='ArrowLeft'){e.preventDefault();u(i-1);}});document.getElementById('bio-btn').onclick=function(e){e.stopPropagation();document.getElementById('bio-panel').classList.toggle('open');};document.querySelector('.cl
