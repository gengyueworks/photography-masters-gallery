用摄影探讨一个哲学家式的问题：我们看到的"真实"到底是什么？</p>
<p>他的照片拍的是"风景的替代品"：旅游明信片、地图册里的等高线、被画成天空的墙、明信片商店里排列整齐的风景照。他拍的不是山——是山的图片。他的意大利风景摄影温柔、安静、带一点点荒诞。</p>
<p>他 1970 年代与一群意大利摄影师组织了"摄影行动"运动，影响了一整代欧洲当代摄影。1992 年他因心脏病去世，年仅 48 岁。</p></div><script>var images=["17f146e1acaee324b6673c09a26c473c.jpg", "1d3f89332a317cb1631d40b384e0333c.jpg", "275d8a7f194fc126cd46348504d7939d.jpg", "33b935e32df69bf0c80df7e469db8938.jpg", "3f47589031f1c9ae80775ce91b90377a.jpg", "43c4644ed4c290eb3a06a87392c424c8.jpg", "4d685d701b2bcac3de5a6abddb9ea0ed.jpg", "7384182e647816af07c552c021859dbf.jpg", "7dbd984a01c88ae8a42755a84ffe772c.jpg", "7f4f9255939d4024768a28465df09be5.jpg", "8612ed6ae4fc4742bb7ca234ea2d93a1.jpg", "8bc555b32b158d889da2c2446fee8609.png", "91bea96dbbc816210634142e97882695.jpg", "a6b2763bb6e24588ec7b5bab22ec9f02.jpg", "ae5c519b31095af7e7985cb13c215e29.jpg", "ddf5f807fa339d399721d132605b6ee3.webp", "e4e1754378ee951f8b4aa95ae86cef06.jpg", "e6feef71c2636dd6ad5155c00aeac336.jpg", "fd68232e391ca177bd222f5bbec77f75.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i-1);};document.getElementById('next').onclick
