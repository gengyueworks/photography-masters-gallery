现的室内空间。</p>
<p>她的照片拍的是世界上最壮观的室内：维也纳国家图书馆、巴黎歌剧院、莫斯科地铁站、威尼斯的教堂、牛津的学院礼堂。她的照片永远没有人——只有建筑和光。巨大的空间在照片里变得安静、庄严、像仪式。</p>
<p>她 2013 年在上海美术馆的个展《静观》让她在中国广为人知。她说：'我拍的不是建筑——是时间在空间里留下的安静。'</p></div><script>var images=["00d4d79fb79630b83ef3b56129fcc7f0.jpg", "01a3bcde8bdb6fe6e33a5e36c474cd00.jpg", "01a5a65bbb26207e9318858df710bcc2.jpg", "0262340d40f0a0a2b3944c8078d8be8b.jpg", "02ee1aed1fd14d6103dd4303d1fdd40e.jpg", "0355826a871fe1681e1cf4f06e9aa2b2.jpg", "0366d1c43e033bb1cb118a45ece26a73.jpg", "057a007800c7a35206c78d0ad9a3f3be.jpg", "058dd17280ad3eafa75e1650b3a83923.jpg", "06d7dc128fa72152e8c5038d3f98d95d.jpg", "06e62ba44eebd477a981dddf2200fb15.jpg", "09477f64396781ac9b632f3e7e667223.jpg", "099bf9850e69006fec06cf58762eaad0.jpg", "09b776e3eef8c0bfa470e17ea2b3d771.jpg", "0a96b44c8832e3dd56027b872146762c.jpg", "0b5db6cce248ce6ae70dc80918b538d4.jpg", "0b94d4fa69f75df2992fc2c24f0f30e1.jpg", "0c910f44fe2fb6ebd24257d65f84c833.jpg", "1063116e36c6b529a125528f3d37c39f.jpg", "11baab6e29c82ec1f35c53392714e2e2.jpg", "1243e0ed354fddf6cae54c2640b80cb0.jpg", "12742ff49c828232b98a4741dacc0880.jpg", "12ee48e23ab36c2bbd92857c2dc20c1b.jpg", "13b69c939f65db47f9cb23fbdd390304.jpg", "14dc4f1dd820a612d3fb9f4dabb82e96.jpg", "15723904248a6eb6ddf3b1c240b89700.jpg", "15c7dbe4401f433a58ea11d1a3b90c7e.jpg", "16bc68dbac1184bce86580b131671b71.jpg", "17dbf17861cec2837aec0078e55324a7.jpg", "1827c8168df2134bf66a3b57c1eaa6d7.jpg", "184ab1e9fac46f4b701652300d18411e.jpg", "191fceec6a5c25b46bb5ae9503f6ea9c.jpg", "193de27531313df8d0995762473bf9c3.jpg", "195b404bc138bbe3820cbae51993735e.jpg", "1a3b2e8ae9348e1af0fbdb08e8d78a1a.jpg", "1ab4c5666e0509f47a7cb7d6890206e4.jpg", "1acf99aca564824e0d42b36a1f7f8f16.jpg", "1bcaab6902486b1f9756dd4dfc9390d3.jpg", "1bdf8d6e9079825516c2ca48a6e00c70.jpg", "1c7047d54b62a0e0b632cb361850eec1.jpg", "1e6552b6a3237051ede434315faac391.jpg", "1ea2e1d20d3f0550248e8f904a611d4f.jpg", "1f7d662ad09f4e86ba75592f12c8469f.jpg", "1fe9d97b4ba84b07f1585f7f46656e2b.jpg", "205af2d2bb0f8d801afda329c879da65.jpg", "207488fc67e2bace484c28022f94c71e.jpg", "20f15ac27c2c1c1abbe6475350586ed8.jpg", "20f92d89f17263ac16458bb7616c
