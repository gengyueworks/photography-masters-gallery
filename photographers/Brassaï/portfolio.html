<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brassaï · Portfolio</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; height: 100vh; width: 100vw; user-select: none; -webkit-user-select: none; cursor: pointer; }
#main-image { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#main-image img { max-width: 98vw; max-height: 92vh; object-fit: contain; transition: opacity 0.25s ease; }
#counter { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); font-size: 14px; color: rgba(255,255,255,0.5); z-index: 10; letter-spacing: 2px; }
#filmstrip { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 4px; padding: 0 16px; overflow-x: auto; z-index: 10; scrollbar-width: none; }
#filmstrip::-webkit-scrollbar { display: none; }
#filmstrip .thumb { height: 56px; min-width: 56px; flex-shrink: 0; border-radius: 2px; overflow: hidden; cursor: pointer; opacity: 0.35; transition: opacity 0.2s, transform 0.2s; border: 2px solid transparent; }
#filmstrip .thumb:hover { opacity: 0.65; transform: translateY(-2px); }
#filmstrip .thumb.active { opacity: 1; border-color: #fff; transform: translateY(-4px); }
#filmstrip .thumb img { width: 100%; height: 100%; object-fit: cover; }
.nav-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: none; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; border-radius: 50%; z-index: 10; transition: background 0.2s; }
.nav-btn:hover { background: rgba(255,255,255,0.15); }
#prev { left: 20px; } #next { right: 20px; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; background: #000; transition: opacity 0.5s; }
#loading.hidden { opacity: 0; pointer-events: none; }
.loader { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#home-btn { position: fixed; top: 20px; left: 20px; z-index: 20; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: background 0.2s; text-decoration: none; display: inline-block; }
#home-btn:hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="loading"><div class="loader"></div></div>
<a href="../../index.html" id="home-btn">← 画廊</a>
<div id="counter"></div>
<div id="main-image"><img src="" id="display-img" alt=""></div>
<button class="nav-btn" id="prev">←</button>
<button class="nav-btn" id="next">→</button>
<div id="filmstrip"></div>
<script>
var images = ["02342d1e8a218a32df3125c066c86989.jpg", "0470742af2edbab503c475b97bc6251d.jpg", "0c470577c027753df17c25b2902c1f79.jpg", "110f54236070b5e9529bee6f07e83c8e.jpg", "14adc31c919d4aa70495eff9dd230b15.jpg", "18dea0858f71efdda744b0bc55657ed0.jpg", "1bc0d397e6b9471798e3b9046a107912.jpg", "1c5b6e54c30c83d90ba87582738e1460.jpg", "22407630d8c625d5d7174267e4342586.jpg", "23c734dc82af151b77d04fb4e5692eaa.jpg", "40610c4c1513179d4033b27c5620bb09.jpg", "4971ed9a174f6fb656b472b874f0abc3.jpg", "522abea325c2413ec2b27cb4b8327606.jpg", "561ef98a19f153eb222c437b7f4eb54d.jpg", "68e59eb89e32ffc448d137a932805127.jpg", "770609ac46936f1b8b5d3faa1284a690.jpg", "7a19df20bf5b9e4f767dbbb429c3acf0.jpg", "7f89b7df4d785f3f23f912bc8fc68369.jpg", "87ad65a5888457a75cd3763090981965.jpg", "9e1c061b90f7f965f604a64454364c96.jpg", "a1706467e4700c43dbb54ffb8140d1d2.jpg", "a307c1e1cad4618426690c5e99131849.jpg", "c444055c54d264602140c3d5ee855d19.jpg", "c61c7462bdf45fcdb9af247e54f76dfe.jpg", "cf14b2f929a7ceefcbce4e8b8515abfd.jpg", "d01dfe8d73f53a1aa5522d9abfcadd46.jpg", "d509151f184c8eee75233f73750118b7.jpg", "ec176384885c890804fba95c5a05aa33.jpg", "ed6ffc2af18abe7e0ff4aa8ef3bd6a41.jpg", "f22244914241574bef8de3f04835fd30.jpg"];
var currentIndex = 0;
var display = document.getElementById('display-img');
var counter = document.getElementById('counter');
var filmstrip = document.getElementById('filmstrip');
var loading = document.getElementById('loading');
function update(idx) {
  idx = (idx + images.length) % images.length;
  currentIndex = idx;
  loading.classList.remove('hidden');
  var img = new Image();
  img.onload = function() { display.src = 'images/' + images[idx]; loading.classList.add('hidden'); updateFilmstrip(); };
  img.onerror = function() { display.src = 'images/' + images[idx]; loading.classList.add('hidden'); };
  img.src = 'images/' + images[idx];
  counter.textContent = (idx + 1) + ' / ' + images.length;
}
function updateFilmstrip() {
  filmstrip.innerHTML = '';
  images.forEach(function(fn, i) {
    var div = document.createElement('div');
    div.className = 'thumb' + (i === currentIndex ? ' active' : '');
    var img = document.createElement('img');
    img.src = 'images/' + fn;
    div.appendChild(img);
    div.onclick = function() { update(i); };
    filmstrip.appendChild(div);
  });
  var active = filmstrip.querySelector('.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
update(0);
document.body.onclick = function(e) {
  if (e.target.closest('#filmstrip') || e.target.closest('#home-btn') || e.target.closest('.nav-btn')) return;
  update(currentIndex + 1);
};
document.getElementById('prev').onclick = function(e) { e.stopPropagation(); update(currentIndex - 1); };
document.getElementById('next').onclick = function(e) { e.stopPropagation(); update(currentIndex + 1); };
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); update(currentIndex + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); update(currentIndex - 1); }
});
</script>
</body>
</html>
