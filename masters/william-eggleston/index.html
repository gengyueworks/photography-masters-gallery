function render() {
  const feed = document.getElementById('feedContainer');
  const grid = document.getElementById('gridContainer');
  feed.innerHTML = ''; grid.innerHTML = '';
  
  IMAGES.forEach((item, idx) => {
    const fc = document.createElement('article');
    fc.className = 'feed-card';
    fc.innerHTML = `
      <img src="images/${item.filename}" alt="作品" loading="lazy" onclick="openLight(${idx})">
      <div class="feed-card-footer">
        <span># 威廉·埃格尔斯顿 作品</span>
        <span>${item.width}×${item.height}</span>
      </div>
    `;
    feed.appendChild(fc);
    
    const mi = document.createElement('div');
    mi.className = 'masonry-item';
    mi.innerHTML = `<img src="images/${item.filename}" alt="作品" loading="lazy" onclick="openLight(${idx})">`;
    grid.appendChild(mi);
  });
}

function setView(mode) {
  const feed = document.getElementById('feedContainer');
  const grid = document.getElementById('gridContainer');
  document.getElementById('btnFeed').classList.toggle('active', mode === 'feed');
  document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
  if (mode === 'feed') {
    feed.classList.remove('hidden'); grid.classList.remove('active');
  } else {
    feed.classList.add('hidden'); grid.classList.add('active');
  }
}

function openLight(idx) {
  activeIdx = idx;
  document.getElementById('lightboxImg').src = 'images/' + IMAGES[idx].filename;
  document.getElementById('lightboxCounter').textContent = `${idx + 1} / ${IMAGES.length} · 威廉·埃格尔斯顿`;
  document.getElementById('lightboxModal').classList.add('active');
}
function closeLightbox() { document.getElementById('lightboxModal').classList.remove('active'); }
function nextLight() { openLight((activeIdx + 1) % IMAGES.length); }
function prevLight() { openLight((activeIdx - 1 + IMAGES.length) % IMAGES.length); }

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'paper';
  const next = cur === 'dark' ? 'paper' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('master_theme', next);
}

window.addEventListener('keydown', (e) => {
  const m = document.getElementById('lightboxModal');
  if (m.classList.contains('active')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight' || e.key === ' ') nextLight();
    if (e.key === 'ArrowLeft') prevLight();
  }
});

let touchStartX = 0;
document.getElementById('lightboxModal').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
document.getElementById('lightboxModal').addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff < -40) nextLight();
  if (diff > 40) prevLight();
}, { passive: true });

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('master_theme') || 'paper';
  document.documentElement.setAttribute('data-theme', saved);
  render();
});
</script>
