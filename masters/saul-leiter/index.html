<style>
:root {
  --bg-primary: #fbf9f5; --bg-secondary: #f3efe6; --bg-tertiary: #e8e2d5;
  --card-bg: #ffffff; --card-border: rgba(0, 0, 0, 0.08); --card-border-strong: rgba(0, 0, 0, 0.16);
  --text-primary: #18181b; --text-secondary: #4b5563; --text-muted: #6b7280; --text-gold: #b45309;
  --accent-gold: #b45309; --accent-gold-bg: rgba(180, 83, 9, 0.08);
  --font-serif: "Cinzel", "Newsreader", Georgia, serif;
  --font-body: "Plus Jakarta Sans", -apple-system, sans-serif;
  --font-mono: "Space Grotesk", monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.06);
  --radius-sm: 6px; --radius-md: 10px;
}
[data-theme="dark"] {
  --bg-primary: #0f1013; --bg-secondary: #16181e; --bg-tertiary: #20232b;
  --card-bg: #181a20; --card-border: rgba(255, 255, 255, 0.09); --card-border-strong: rgba(255, 255, 255, 0.18);
  --text-primary: #f4f4f5; --text-secondary: #9ca3af; --text-muted: #6b7280; --text-gold: #eab308;
  --accent-gold: #eab308; --accent-gold-bg: rgba(234, 179, 8, 0.12);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg-primary); color: var(--text-primary); line-height: 1.75; -webkit-font-smoothing: antialiased; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.site-header { position: sticky; top: 0; z-index: 100; background: rgba(251,249,245,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border); }
[data-theme="dark"] .site-header { background: rgba(15,16,19,0.9); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand-badge { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }
.brand-mark { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-gold), #9a6700); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: #fff; }
.header-actions { display: flex; align-items: center; gap: 10px; }

.pill-btn { background: var(--bg-secondary); border: 1px solid var(--card-border-strong); color: var(--text-primary); padding: 6px 14px; border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 13px; font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
.pill-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

.hero { padding: 50px 0 32px; text-align: center; border-bottom: 1px solid var(--card-border); }
.hero-tag { display: inline-block; padding: 4px 14px; background: var(--accent-gold-bg); border: 1px solid var(--card-border); border-radius: 20px; font-family: var(--font-mono); font-size: 11px; color: var(--text-gold); font-weight: 700; margin-bottom: 14px; }
.hero-title { font-family: var(--font-serif); font-size: clamp(30px, 4.5vw, 48px); font-weight: 700; margin-bottom: 12px; }
.hero-quote { max-width: 680px; margin: 0 auto 24px; font-size: 15px; color: var(--text-secondary); line-height: 1.8; font-style: italic; background: var(--bg-secondary); padding: 16px 20px; border-radius: var(--radius-md); border-left: 3px solid var(--accent-gold); }

.stats-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.stat-pill { background: var(--bg-secondary); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary); }
.stat-pill strong { color: var(--text-primary); }

.controls-bar { position: sticky; top: 60px; z-index: 90; background: rgba(251,249,245,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 10px 0; }
[data-theme="dark"] .controls-bar { background: rgba(15,16,19,0.95); }
.controls-inner { display: flex; align-items: center; justify-content: space-between; }
.view-btn-group { display: flex; gap: 4px; background: var(--bg-secondary); padding: 3px; border-radius: 8px; border: 1px solid var(--card-border); }
.v-btn { background: transparent; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-secondary); font-weight: 600; }
.v-btn.active { background: var(--card-bg); color: var(--text-gold); box-shadow: var(--shadow-sm); }

.gallery-section { padding: 32px 0 80px; }
.feed-layout { display: flex; flex-direction: column; gap: 32px; max-width: 680px; margin: 0 auto; }
.feed-card { background: var(--card-bg); border: 1px solid var(--card-border-strong); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
.feed-card img { width: 100%; height: auto; display: block; cursor: zoom-in; }
.feed-card-footer { padding: 12px 16px; display: flex; justify-content: space-between; border-top: 1px solid var(--card-border); background: var(--bg-secondary); font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

.masonry-layout { display: none; column-count: 3; column-gap: 16px; }
.masonry-layout.active { display: block; }
.feed-layout.hidden { display: none; }
.masonry-item { break-inside: avoid; margin-bottom: 16px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--card-border); background: var(--bg-secondary); cursor: zoom-in; }
.masonry-item img { width: 100%; height: auto; display: block; }

.lightbox-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; padding: 20px; }
.lightbox-modal.active { display: flex; }
.lightbox-img-wrap { max-width: 94vw; max-height: 90vh; position: relative; }
.lightbox-img { max-width: 100%; max-height: 88vh; border-radius: var(--radius-sm); }
.lightbox-close { position: absolute; top: -44px; right: 0; background: transparent; border: none; color: #fff; font-size: 32px; cursor: pointer; }
.lightbox-counter { text-align: center; font-family: var(--font-mono); font-size: 13px; color: var(--text-gold); margin-top: 10px; }

@media (max-width: 768px) {
  .masonry-layout { column-count: 2; column-gap: 10px; }
  .hero-title { font-size: 28px; }
}
@media (max-width: 480px) {
  .masonry-layout { column-count: 1; }
}
</style>

let activeIdx = 0;

function render() {
  const feed = document.getElementById('feedContainer');
  const grid = document.getElementById('gridContainer');
  feed.innerHTML = ''; grid.innerHTML = '';
  
  IMAGES.forEach((item, idx) => {
    const fc = document.createElement('article');
    fc.className = 'feed-card';
    fc.innerHTML = `
      <img src="images/${item.filename}" alt="作品" loading="lazy" onclick="openLight(${idx})">
      <div class="feed-card-footer">
        <span># 索尔·雷特 作品</span>
        <span>${item.width}×${item.height}</span>
      </div>
    `;
    feed.appendChild(fc);
    
    const mi = document.createElement('div');
    mi.className = 'masonry-item';
    mi.innerHTML = `<img src="images/${item.filename}" alt="作品" loading="lazy" onclick="openLight(${idx})">`;
    grid.appendChild(mi);
  });
}

function setView(mode) {
  const feed = document.getElementById('feedContainer');
  const grid = document.getElementById('gridContainer');
  document.getElementById('btnFeed').classList.toggle('active', mode === 'feed');
  document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
  if (mode === 'feed') {
    feed.classList.remove('hidden'); grid.classList.remove('active');
  } else {
    feed.classList.add('hidden'); grid.classList.add('active');
  }
}

function openLight(idx) {
  activeIdx = idx;
  document.getElementById('lightboxImg').src = 'images/' + IMAGES[idx].filename;
  document.getElementById('lightboxCounter').textContent = `${idx + 1} / ${IMAGES.length} · 索尔·雷特`;
  document.getElementById('lightboxModal').classList.add('active');
}
function closeLightbox() { document.getElementById('lightboxModal').classList.remove('active'); }
function nextLight() { openLight((activeIdx + 1) % IMAGES.length); }
function prevLight() { openLight((activeIdx - 1 + IMAGES.length) % IMAGES.length); }

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'paper';
  const next = cur === 'dark' ? 'paper' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('master_theme', next);
}

window.addEventListener('keydown', (e) => {
  const m = document.getElementById('lightboxModal');
  if (m.classList.contains('active')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight' || e.key === ' ') nextLight();
    if (e.key === 'ArrowLeft') prevLight();
  }
});

let touchStartX = 0;
document.getElementById('lightboxModal').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
document.getElementById('lightboxModal').addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff < -40) nextLight();
  if (diff > 40) prevLight();
}, { passive: true });

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('master_theme') || 'paper';
  document.documentElement.setAttribute('data-theme', saved);
  render();
});
</script>
</body>
