度的北极海水中拍摄，在鲸鱼身边游泳拍下的照片让全世界第一次看到南极水下长什么样。</p>
<p>他最著名的照片：豹海豹张开大口游向他、独角鲸在水下的"角"、海象群、以及他在极地冰川水下拍的"冰花"。他是海洋保护组织 SeaLegacy 的创始人之一，用摄影推动保护海洋。</p>
