滚石》封面——但他最出名的是一张他几乎没认真拍的照片：乔布斯 2006 年那张黑白肖像，后来被印成了乔布斯传记的封面。</p>
<p>他的技术极其全面：黑白棚拍、彩色外景、裸体、风景、广告。他给 LV、Chanel、Levi's 拍广告，也给世界各地拍杂志大片。他的工作室遍布纽约、巴黎和苏格兰。</p>
<p>他有一只眼睛失明——一只先天白内障——但他没有停过一天工。他说：'一只眼睛够用了——剩下的用想象补。'</p></div><script>var images=["01fd0df1f3d70acb04b295d837bc537d.jpg", "0249dfb20044ecf2104334ba3214ef36.jpg", "0336100b3867f9cbcda6130e9b80b11b.jpg", "04ad6f28beb29f7e747cdec7d8acb2e4.jpg", "074212daed98907c7ed6e08d8eb3e61e.jpg", "08707334a2e24f5e082f08a812f3ef2a.jpg", "0a342899bbfa49de44037abf25a1030a.jpg", "0ab9ce55a29a65a7e6a6e2a2278a6a29.jpg", "0b834c602c0cd5bf96fca65a42462de9.jpg", "0c2f1eba93dc69dd27f7e7a9e4946d19.jpg", "0c841d666d4073a7e48f94607de07e74.jpg", "0dbb7bc57abd997118c0f8de922b8aed.jpg", "0ee6e13473596b3dcf91f04636348d1c.jpg", "114b2fd667272b2f530836b766d255ba.jpg", "117d534016651f22a517944f91a79d70.jpg", "11fe6a768381e2b89afd416f9b47fbcb.jpg", "1403b6b39eb626031718519757f2a53f.jpg", "152d0ec8b32501657b9c73fa38518fb4.jpg", "152d89c897a0ad1c5d74e1e802c44a2a.jpg", "15e93d835cd6f407fb475339e6e232da.jpg", "16358b385b09fccd10c2b76d45bdddbe.jpg", "197f5dcc94708fe5c6c9cd7ba0526aa4.png", "19ed75fc0ce901138ddf1a36815cc851.jpg", "1bd1e08713814af429265edccb140dc2.png", "1e0911156bf4b94b2211cd99951adf75.jpg", "1fccd94a86766ea74670162274f6c52b.jpg", "210a2961247869da128704b6e7266591.jpg", "215e6ac862fdcd1041278e9860e9b1c2.jpg", "22322399179cff1e4af2eb929f30cbfc.jpg", "226deabb24531fb5528275e7b734615f.jpg", "22ab068802606ebd3e4e5761a7b0b838.jpg", "232fd2ff69578bc2d9d5c2c146c66258.jpg", "2392a9c65faca47a05e008c5e76c0731.jpg", "23a75418d3b705b6b63d18657b1d350c.jpg", "23e4b43db1d91a7c4d736e2caa3c1c60.jpg", "245a1c8e31143c020590b2c8fc7be1f8.jpg", "247a72ad1dc26e775dc28421755edd21.jpg", "24a7b9eeaf6990140a1bc8c14167f112.jpg", "253e929c4921980e9acc622d0c5f2cdb.jpg", "2547c30c855e65dad78e0704d211175f.jpg", "2680e9102b99b2e9b012ca665282f7cd.jpg", "272834678e19ee68e41e293241da9cc4.jpg", "275b0fa91d003f5459931caf379b42c5.jpg", "2795e864404ef0d89909b9bab0574c39.jpg", "27c314f633a7ad769142d00a15e357bc.jpg", "27dbe7dcd5ce8c7b9f10fd8054c67d8a.jpg", "294c420b2a2339ffa5c07417faa82a16.jpg", "29e14ec24130b7aca03c7e5ee14fb807.jp
