世纪最重要的摄影师之一。</p>
<p>他最有名的作品是《窗边》系列——40 年时间拍摄他工作室的同一扇窗户：窗玻璃上的雨滴、窗台上的花、透过窗纱的光。他拍布拉格的街道——雾中的查理大桥、雪中的老城广场。他的照片有一种木头和灰尘的味道——一种旧欧洲的温柔。</p>
<p>他不参加展览、不接受采访——一个人在他的工作室里拍了五十年。他说：'一切都在我的房间里。我的生活就是我的照片。'</p></div><script>var images=["002e0f40407ca08202025220e989d018.jpg", "00400b9f4d1e8c21b525e7ca7ce8a900.jpg", "02b08dd3f257047e3b54af76a9a6153c.jpg", "036b0c4517ac341dc708f77e9466ace2.jpg", "03b2aaa42ef67f2e9deaa48d9009ec2b.jpg", "051b82b2d22fb10e19d0c0af4720c906.jpg", "072ca9a98b81342761de63603e1626aa.jpg", "07fe8bcfa65acde122eef6c992dad650.jpg", "08df70154b45a9dba5e536af2a66c255.jpg", "0a267d3ed6ee4ff11e085154c22adb3c.jpg", "0b0e7be8bf8086f394f4aaa86d5f385e.jpg", "0c4db6af2fd542afd6b9013c67297acb.jpg", "0db7da33cd5c4929795ad470ec1c7e75.jpg", "0e6219aaba74698d8c35a6e016b973dc.jpg", "109f18af0cc9afb4ac06b949e2cb4b12.jpg", "1100555a60c184e501b143b930a10255.jpg", "114687b9dbfb7728583992af0304c082.webp", "116ff1165533347750ecd9c2edab953f.jpg", "118f07a802531183563212a1f78c7a3f.jpg", "127975244cdca26dce37aef06a9d859f.jpg", "128aa37e4ff378d0c43cf01cf22432f1.jpg", "13458d64563e63a597cb1ac20f89ddb6.jpg", "13c1a5ab1562e2eb9c0e90b28af63fea.jpg", "1464d857772cd994ec2a9bb73f7db5e8.jpg", "14f4283ef7f5bce879a57385b7b4095b.jpg", "1699fda2595ad95930f601560627a6c2.jpg", "18820d73083cbfd1628ab5a468566926.jpg", "1886123bb092644ed0f1d8f61a9892bb.jpg", "19bd6fa43bc007e4a01dd6f987456644.jpg", "1c575518d68734be72b32a0d64c16de3.jpg", "1f3c143a4dc6570c5685e75c0d2478da.jpg", "1fd4873685fb0d60bb0944adbc3d5815.jpg", "1fe603618190605a8eb548006ae1d9b7.jpg", "2162d34a17d0599468ad7e0d87515543.jpg", "230b716f34b7c519393a005ea4305fd4.jpg", "24b1dc8c6eff91182dee8213f338020d.jpg", "250239f7e7d8ef543be6af76284d4727.jpg", "259b246d19cc83496fad97af7c307e8e.jpg", "25b362737916ee7d4935adc5dd7dbecd.jpg", "271ae223aff2a25862542eec06a56f08.jpg", "2af58ab2bba385e3959210aa1e442684.jpg", "2afec1e81e8c989da5fdcbab139183c5.jpg", "2bcacbd5c6e157e1cc079a2519fdc420.jpg", "2cdb4658d7a58878477d5c6c8e1bf38a.jpg", "3144de588784f649cd78b4e7d5ca7616.jpg", "31b047fca1ade0038db4e36dce27edf0.jpg", "32b534b1208dee87215943fd0c5eea5a.jpg", "356850deb25d21f38aadfc0478a3f
