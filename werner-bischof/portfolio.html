:50%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}#home-btn{position:fixed;top:20px;left:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;text-decoration:none;display:inline-block;}#home-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-btn{position:fixed;top:20px;right:20px;z-index:20;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:6px 14px;font-size:13px;cursor:pointer;border-radius:4px;letter-spacing:1px;transition:background .2s;}#bio-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}#bio-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(20,20,20,.97);z-index:30;transition:right .4s;padding:60px 32px 32px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.08);}#bio-panel.open{right:0;}#bio-panel h2{font-size:24px;font-weight:300;letter-spacing:3px;margin-bottom:8px;}#bio-panel .sub{color:rgba(255,255,255,.35);font-size:13px;letter-spacing:1px;margin-bottom:24px;}#bio-panel p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:16px;}#bio-panel .close-bio{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}</style></head><body><div id="loading"><div class="loader"></div></div><a href="../index.html" id="home-btn">← 画廊</a><button id="bio-btn">传记</button><div id="counter"></div><div id="main-image"><img src="" id="display-img" alt=""></div><button class="nav-btn" id="prev">←</button><button class="nav-btn" id="next">→</button><div id="filmstrip"></div><div id="bio-panel"><button class="close-bio">✕</button><h2>Werner Bischof</h2><div class="sub">1916–1954 · 瑞士</div><p>Werner Bischof 是 Magnum 的创始成员之一。他 1916 年出生于苏黎世。他原本是严谨的构图摄影师，1945 年走进战后的欧洲废墟后，他的镜头转向了人——那些在废墟里活下来的人。</p>
<p>他 1948 年到 1952 年在印度、日本、东南亚拍摄——他拍下饥荒中的印度、战后日本的孩子们。他最著名的照片之一是印度饥荒中的母亲抱着婴儿——极度克制的构图里藏着巨大的悲痛。</p>
<p>1954 年他在秘鲁安第斯山脉采访时坠车身亡，年仅 38 岁。他留下的话是：'我现在明白了——最好的照片不是风景，是人的脸。'</p></div><script>var images=["017bbcc3d4a28f8788397eb7c02e3337.jpg"];var i=0,d=document.getElementById('display-img'),c=document.getElementById('counter'),f=document.getElementById('filmstrip'),l=document.getElementById('loading');function u(idx){idx=(idx+images.length)%images.length;i=idx;l.classList.remove('hidden');var img=new Image();img.onload=function(){d.src='images/'+images[idx];l.classList.add('hidden');uf();};img.onerror=function(){d.src='images/'+images[idx];l.classList.add('hidden');};img.src='images/'+images[idx];c.textContent=(idx+1)+' / '+images.length;}function uf(){f.innerHTML='';images.forEach(function(fn,idx){var div=document.createElement('div');div.className='thumb'+(idx===i?' active':'');var img=document.createElement('img');img.src='images/'+fn;div.appendChild(img);div.onclick=function(){u(idx);};f.appendChild(div);});var a=f.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}u(0);document.body.onclick=function(e){if(e.target.closest('#filmstrip,#home-btn,.nav-btn,#bio-panel,#bio-btn'))return;u(i+1);};document.getElementById('prev').onclick=function(e){e.stopPropagation();u(i-1);};document.getElementById('next').onclick=function(e){e.stopPropagation();u(i+1);};document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();u(i+1);}if(e.key==='ArrowLeft'){e.preventDefault();u(i-1);}});document.getElementById('bio-btn').onclick=function(e){e.stopPropagation();document.getElementById('bio-panel').classList.toggle('open');};document.querySelector('.close-bio').onclick=function(e){e.stopPropagation();document.getElementById('bio-panel').classList.remove('open');};</script></body></html>
